<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life OS">
<meta name="theme-color" content="#0a0d17">
<title>Life OS — Personal Intelligence System</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=DM+Serif+Display:ital@0;1&display=swap');

/* ══════════════════════════════════════════
   LIFE OS v3 — DESIGN SYSTEM
   Signature: Obsidian black + Indigo pulse
   + Saffron gold life-line + Event timeline
══════════════════════════════════════════ */
:root {
  --bg0:#080b14; --bg1:#0e1220; --bg2:#141928; --bg3:#1a2035;
  --bg4:#212840; --bg5:#2a3350; --rim:#334;
  --ind:#6366f1; --vio:#8b5cf6; --saf:#f59e0b;
  --em:#10b981; --sky:#38bdf8; --ros:#f43f5e;
  --cor:#fb923c; --pin:#ec4899;
  --is:rgba(99,102,241,.15); --vs:rgba(139,92,246,.13);
  --ss:rgba(245,158,11,.13); --es:rgba(16,185,129,.12);
  --ks:rgba(56,189,248,.11); --rs:rgba(244,63,94,.12);
  --t0:#f0f3ff; --t1:#9ba5c2; --t2:#4e5878; --t3:#2c3452;
  --b1:rgba(255,255,255,.055); --b2:rgba(255,255,255,.1); --b3:rgba(255,255,255,.17);
  --r:10px; --rl:14px; --trans:160ms ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:var(--bg0);color:var(--t0);display:flex;flex-direction:column;font-size:13px}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}
textarea,input,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;touch-action:manipulation}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:4px}


@keyframes starpop{0%{transform:scale(.3) rotate(-25deg);opacity:0}60%{transform:scale(1.25) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
/* ══ MOBILE-FIRST MINIMALIST LAYER (v5) ══ */
#bnav{display:none}
#moresheet{display:none}
.nudgecard{background:linear-gradient(135deg,rgba(99,102,241,.14),rgba(245,158,11,.08));border:1px solid rgba(99,102,241,.25);border-radius:var(--rl);padding:14px 16px;margin-bottom:14px}
.nc-lbl{font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--saf);margin-bottom:5px}
.nc-txt{font-size:12.5px;color:var(--t0);line-height:1.6}
.nc-act{margin-top:8px;font-size:11px;font-weight:700;color:var(--ind);cursor:pointer}
.qrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.qbtn{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rl);padding:13px 4px;text-align:center;cursor:pointer;transition:var(--trans)}
.qbtn:active{background:var(--bg3);transform:scale(.96)}
.qbi{font-size:19px;margin-bottom:4px}
.qbl{font-size:9px;font-weight:600;color:var(--t1)}



.micb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex-shrink:0;
  border-radius:9px;background:var(--bg3);border:1px solid var(--b1);font-size:15px;cursor:pointer;transition:var(--trans);user-select:none}
.micb:active{transform:scale(.9)}
.micb.rec{background:var(--rs);border-color:var(--ros);animation:micpulse 1.1s infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.5)}50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
.inrow{display:flex;gap:7px;align-items:center}
.inrow .ti{flex:1;margin:0}
#fab{display:none}
@media (max-width:1024px), (orientation:landscape) and (max-height:600px){
  #fab{display:flex;position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:54px;height:54px;
    border-radius:50%;background:linear-gradient(135deg,var(--ind),var(--vio));align-items:center;justify-content:center;
    font-size:22px;z-index:290;cursor:pointer;box-shadow:0 6px 20px rgba(99,102,241,.45);border:none}
  #fab:active{transform:scale(.92)}
}
/* ══ LIGHT THEME ══ Applied via data-theme="light" on <html> */
html[data-theme="light"]{
  --bg0:#f6f7fb; --bg1:#ffffff; --bg2:#ffffff; --bg3:#f0f2f8;
  --bg4:#e4e8f2; --bg5:#d4dae8; --rim:#c8cfe0;
  --ind:#4f46e5; --vio:#7c3aed; --saf:#c2740a;
  --em:#059669; --sky:#0284c7; --ros:#e11d48;
  --cor:#ea580c; --pin:#db2777;
  --is:rgba(79,70,229,.09); --vs:rgba(124,58,237,.08);
  --ss:rgba(194,116,10,.10); --es:rgba(5,150,105,.09);
  --ks:rgba(2,132,199,.09); --rs:rgba(225,29,72,.09);
  --t0:#0f1424; --t1:#4a5372; --t2:#7d87a3; --t3:#aab2c6;
  --b1:rgba(15,20,36,.075); --b2:rgba(15,20,36,.13); --b3:rgba(15,20,36,.2);
}
html[data-theme="light"] body{background:var(--bg0)}
html[data-theme="light"] .card,html[data-theme="light"] .sc{box-shadow:0 1px 3px rgba(15,20,36,.05)}
html[data-theme="light"] #top,html[data-theme="light"] #sb{background:#ffffff}
html[data-theme="light"] #bnav{background:rgba(255,255,255,.97)}
html[data-theme="light"] .msheet{background:#ffffff}
html[data-theme="light"] #sbdrop,html[data-theme="light"] #chk-ov,
html[data-theme="light"] #hp-ov,html[data-theme="light"] #rw-ov,
html[data-theme="light"] #welcome-ov,html[data-theme="light"] #moresheet.on{background:rgba(15,20,36,.45)}
html[data-theme="light"] .logo{color:#fff}
html[data-theme="light"] .bni.on{color:var(--ind)}

/* ── TOPBAR ── */
#top{height:calc(48px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:var(--bg1);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));gap:10px;flex-shrink:0;z-index:100}
#thtog{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--bg3);border:1px solid var(--b1);font-size:13px;cursor:pointer;transition:var(--trans)}
#thtog:active{transform:scale(.92)}
#sbtog{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--bg3);border:1px solid var(--b1);color:var(--t1);font-size:15px;cursor:pointer;transition:var(--trans)}
#sbtog:hover{background:var(--bg4);color:var(--t0)}
#sbtog:active{transform:scale(.92)}
body.sb-off #sb{display:none}
#sbdrop{display:none;position:fixed;inset:0;background:rgba(8,11,20,.6);backdrop-filter:blur(3px);z-index:340}
#sbdrop.on{display:block}
.logo{width:30px;height:30px;background:linear-gradient(135deg,var(--ind),var(--vio));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 0 18px rgba(99,102,241,.4)}
.brand{font-size:13px;font-weight:700;letter-spacing:.03em}
.ver{font-size:9px;color:var(--t3);background:var(--bg3);padding:2px 6px;border-radius:4px;border:1px solid var(--b1);font-family:'JetBrains Mono',monospace}
.sp{flex:1}
.tnav{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tnav::-webkit-scrollbar{display:none}
.tnb{flex-shrink:0}
.tnb{padding:4px 11px;border-radius:6px;font-size:11px;font-weight:500;background:transparent;color:var(--t2);transition:var(--trans)}
.tnb:hover{background:var(--bg3);color:var(--t1)}
.tnb.on{background:var(--is);color:var(--ind)}
.tright{display:flex;align-items:center;gap:8px}
#clk{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t1);background:var(--bg3);padding:3px 9px;border-radius:5px;border:1px solid var(--b1)}
.ebadge{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;background:var(--es);border:1px solid rgba(16,185,129,.25);font-size:10px;font-weight:600;color:var(--em);cursor:pointer;transition:var(--trans)}
.epulse{width:6px;height:6px;border-radius:50%;background:var(--em);animation:ep 2s infinite}
@keyframes ep{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}50%{box-shadow:0 0 0 4px rgba(16,185,129,0)}}
.lifeline{height:2px;background:linear-gradient(90deg,var(--ind),var(--vio),var(--saf),var(--em),var(--ind));background-size:300%;animation:ll 5s linear infinite;flex-shrink:0}
@keyframes ll{0%{background-position:0%}100%{background-position:300%}}

/* ── SHELL ── */
#shell{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
#sb{width:220px;background:var(--bg1);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.score-w{margin:12px 10px 6px;background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(139,92,246,.05));border:1px solid rgba(99,102,241,.2);border-radius:var(--r);padding:14px}
.sw-lbl{font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);margin-bottom:6px}
.sw-row{display:flex;align-items:baseline;gap:3px}
.sw-big{font-family:'DM Serif Display',serif;font-size:40px;color:var(--ind);line-height:1}
.sw-dom{font-size:9px;color:var(--t2)}
.sw-bar-bg{margin-top:7px;background:var(--bg4);border-radius:3px;height:4px;overflow:hidden}
.sw-bar{height:4px;border-radius:3px;background:linear-gradient(90deg,var(--ind),var(--vio));transition:width .6s ease}
.sw-sub{font-size:9px;color:var(--t2);margin-top:5px}
.ng{padding:10px 8px 4px}
.ngl{font-size:8px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--t3);padding:0 6px;margin-bottom:3px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;font-size:11.5px;font-weight:500;color:var(--t1);cursor:pointer;transition:var(--trans);margin-bottom:1px;position:relative}
.ni:hover{background:var(--bg3);color:var(--t0)}
.ni.on{background:var(--is);color:var(--ind)}
.ni.on::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:0 3px 3px 0;background:var(--ind)}
.nic{font-size:13px;width:16px;text-align:center;flex-shrink:0}
.nbadge{margin-left:auto;font-size:8px;font-weight:800;padding:1px 5px;border-radius:10px;background:var(--ind);color:#fff}
.nbadge.g{background:var(--em)} .nbadge.s{background:var(--saf);color:#000}
.sdiv{height:1px;background:var(--b1);margin:5px 10px}
.sb-stats{padding:6px 14px 14px;display:flex;flex-direction:column;gap:6px}
.ssr{display:flex;justify-content:space-between;align-items:center}
.ssn{font-size:10px;color:var(--t2)}
.ssv{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600}

/* ── MAIN ── */
#main{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg0);padding:22px 26px;padding-left:max(26px,env(safe-area-inset-left));padding-right:max(26px,env(safe-area-inset-right));-webkit-overflow-scrolling:touch}
.panel{display:none}.panel.on{display:block;animation:pin .16s ease}
@keyframes pin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.ph-t{font-family:'DM Serif Display',serif;font-size:22px;color:var(--t0)}
.ph-s{font-size:10.5px;color:var(--t2);margin-top:2px}
.ph-a{display:flex;gap:7px;flex-shrink:0}
.btn{padding:6px 14px;border-radius:7px;font-size:11px;font-weight:600;transition:var(--trans);display:inline-flex;align-items:center;gap:5px}
.bp{background:var(--ind);color:#fff}.bp:hover{background:#7577f3;box-shadow:0 0 14px rgba(99,102,241,.35)}
.bg{background:var(--bg3);color:var(--t1);border:1px solid var(--b2)}.bg:hover{background:var(--bg4);color:var(--t0)}
.bd{background:var(--rs);color:var(--ros);border:1px solid rgba(244,63,94,.2)}.bd:hover{background:rgba(244,63,94,.18)}
.bsm{padding:4px 10px;font-size:10.5px;border-radius:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.card{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);padding:16px}
.card:hover{border-color:var(--b2)}
.chd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ct{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--t1)}
.ca{font-size:10px;color:var(--ind);cursor:pointer;font-weight:600}
.ca:hover{text-decoration:underline}
.sc{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);padding:14px 16px;transition:var(--trans)}
.sc:hover{transform:translateY(-1px);border-color:var(--b2)}
.sl{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t2)}
.sv{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;margin:5px 0 2px;line-height:1}
.sd{font-size:10px}
.up{color:var(--em)}.dn{color:var(--ros)}
.sdiv2{display:flex;align-items:center;gap:8px;margin:18px 0 14px}
.sdiv2-l{flex:1;height:1px;background:var(--b1)}
.sdiv2-t{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);white-space:nowrap}
input[type=range]{width:100%;height:4px;border-radius:4px;-webkit-appearance:none;appearance:none;background:var(--bg4);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ind);border:2px solid var(--bg2);box-shadow:0 0 6px rgba(99,102,241,.5)}
.tog{position:relative;width:36px;height:20px;background:var(--bg4);border-radius:10px;cursor:pointer;transition:var(--trans);flex-shrink:0}
.tog.on{background:var(--ind)}
.tog::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:var(--trans);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog.on::after{left:19px}
.pr{margin-bottom:11px}
.pr-hd{display:flex;justify-content:space-between;margin-bottom:3px}
.pr-n{font-size:11px;color:var(--t1);font-weight:500}
.pr-p{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t2)}
.pr-bg{background:var(--bg4);border-radius:3px;height:5px;overflow:hidden}
.pr-f{height:5px;border-radius:3px;transition:width .7s cubic-bezier(.4,0,.2,1)}

/* ── TOAST ── */
#ta{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column-reverse;gap:7px;z-index:999}
.toast{background:var(--bg4);border:1px solid var(--b2);border-radius:7px;padding:9px 14px;font-size:12px;color:var(--t0);box-shadow:0 4px 20px rgba(0,0,0,.5);animation:tin .18s ease;display:flex;align-items:center;gap:7px;max-width:280px}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* ── FOCUS MODAL ── */
#fov{position:fixed;inset:0;background:rgba(8,11,20,.92);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;z-index:998}
#fov.on{display:flex;animation:foin .2s ease}
@keyframes foin{from{opacity:0}to{opacity:1}}
.fbox{background:var(--bg2);border:1px solid var(--b2);border-radius:var(--rl);width:400px;padding:32px;text-align:center;box-shadow:0 0 80px rgba(99,102,241,.18)}
.flbl{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ind);margin-bottom:6px}
.ftask{font-size:16px;font-weight:700;color:var(--t0);margin:4px 0 20px;font-family:'DM Serif Display',serif}
.fring{position:relative;width:110px;height:110px;margin:0 auto 14px}
.fring svg{width:110px;height:110px;transform:rotate(-90deg)}
.frb{fill:none;stroke:var(--bg4);stroke-width:7}
.frf{fill:none;stroke:var(--ind);stroke-width:7;stroke-linecap:round;stroke-dasharray:314;transition:stroke-dashoffset 1s linear}
.ftnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:var(--ind)}
.fmeta{font-size:10px;color:var(--t2);margin-bottom:20px}
.fbtns{display:flex;gap:7px;justify-content:center}
.fsel{margin-bottom:14px;background:var(--bg3);border:1px solid var(--b2);border-radius:7px;padding:7px 10px;color:var(--t1);font-size:11px;width:100%}

/* ── EVENT TIMELINE ── */
.ev-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--b1);align-items:flex-start}
.ev-item:last-child{border-bottom:none}
.ev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.ev-time{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--t2);width:40px;flex-shrink:0;padding-top:1px}
.ev-body{flex:1}
.ev-type{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ev-detail{font-size:11px;color:var(--t1);margin-top:1px}
.ev-meta{font-size:9px;color:var(--t2);margin-top:2px;display:flex;gap:8px}
.ev-tag{font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:10px}

/* ── HOURLY LOGGER ── */
.hl-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.hl-cell{background:var(--bg3);border-radius:6px;padding:8px 6px;text-align:center;cursor:pointer;border:1px solid transparent;transition:var(--trans)}
.hl-cell:hover{border-color:var(--b2);background:var(--bg4)}
.hl-cell.logged{border-color:rgba(99,102,241,.3);background:var(--is)}
.hl-hour{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--t2);margin-bottom:3px}
.hl-energy{font-size:14px;line-height:1}
.hl-mood{font-size:9px;color:var(--t1);margin-top:2px}

/* ── DECISION JOURNAL ── */
.dj-item{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.dj-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dj-type{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:10px}
.dj-date{font-size:9.5px;color:var(--t2);font-family:'JetBrains Mono',monospace;margin-left:auto}
.dj-decision{font-size:12px;font-weight:600;color:var(--t0);margin-bottom:6px}
.dj-row{display:flex;gap:16px;font-size:10.5px;color:var(--t1)}
.dj-field{display:flex;gap:4px}
.dj-lbl{color:var(--t2);font-weight:600}
.dj-val{color:var(--t0)}
.dj-outcome{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--b1)}
.outcome-bar{flex:1;background:var(--bg4);border-radius:3px;height:4px;overflow:hidden}
.outcome-fill{height:4px;border-radius:3px}

/* ── KNOWLEDGE GRAPH ── */
.kg-node{text-align:center;cursor:pointer}
.kg-circle{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:10px;font-weight:700;transition:var(--trans)}
.kg-circle:hover{transform:scale(1.1)}
.kg-label{font-size:9px;color:var(--t1);font-weight:500}
.kg-arrow{display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:14px;padding:2px 0}

/* ── LIFE DOMAINS RING ── */
.domain-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.domain-card{background:var(--bg3);border:1px solid var(--b1);border-radius:8px;padding:10px;text-align:center;cursor:pointer;transition:var(--trans)}
.domain-card:hover{border-color:var(--b2);transform:translateY(-1px)}
.domain-icon{font-size:18px;margin-bottom:4px}
.domain-name{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t1)}
.domain-score{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;margin-top:2px}
.domain-bar{margin-top:6px;background:var(--bg4);border-radius:3px;height:3px;overflow:hidden}
.domain-fill{height:3px;border-radius:3px}

/* ── AI MEMORY ── */
.mem-item{background:var(--bg3);border:1px solid var(--b1);border-radius:7px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
.mem-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.mem-text{font-size:11.5px;color:var(--t0);line-height:1.5;flex:1}
.mem-date{font-size:9px;color:var(--t2);font-family:'JetBrains Mono',monospace;margin-top:3px}
.mem-del{color:var(--t3);cursor:pointer;font-size:14px;flex-shrink:0}
.mem-del:hover{color:var(--ros)}

/* ── AI CHAT ── */
.ai-shell{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rl);overflow:hidden;display:flex;flex-direction:column;height:calc(100dvh - 190px);min-height:320px}
.aiqb{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px;border-bottom:1px solid var(--b1);background:var(--bg3)}
.qc{padding:4px 11px;border-radius:18px;font-size:10.5px;font-weight:500;background:var(--bg2);color:var(--t1);border:1px solid var(--b2);cursor:pointer;transition:var(--trans)}
.qc:hover{background:var(--is);color:var(--ind);border-color:rgba(99,102,241,.3)}
.aimsg{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;max-width:88%}
.msg.u{margin-left:auto;flex-direction:row-reverse}
.mav{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.mav.b{background:linear-gradient(135deg,var(--ind),var(--vio))}
.mav.u{background:var(--bg4);border:1px solid var(--b2)}
.mb{padding:10px 13px;font-size:12.5px;line-height:1.6;border-radius:10px}
.msg.b .mb{background:var(--bg3);border:1px solid var(--b1);color:var(--t0);border-radius:3px 10px 10px 10px}
.msg.u .mb{background:var(--is);border:1px solid rgba(99,102,241,.22);color:var(--t0);border-radius:10px 3px 10px 10px}
.thk{display:flex;gap:4px;align-items:center;padding:10px 13px;background:var(--bg3);border:1px solid var(--b1);border-radius:3px 10px 10px 10px;width:fit-content}
.td{width:5px;height:5px;border-radius:50%;background:var(--ind);animation:tdb 1.2s ease-in-out infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tdb{0%,80%,100%{opacity:.2}40%{opacity:1}}
.aibar{display:flex;gap:7px;padding:10px 14px;background:var(--bg3);border-top:1px solid var(--b1)}
#aiinp{flex:1;background:var(--bg2);border:1px solid var(--b2);border-radius:7px;padding:9px 12px;color:var(--t0);font-size:12.5px;resize:none;height:42px;line-height:1.4}
#aiinp:focus{border-color:var(--ind)}
#aisend{width:42px;height:42px;border-radius:7px;background:var(--ind);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--trans)}
#aisend:hover{background:#7577f3}
#aisend:disabled{background:var(--bg4);color:var(--t3);cursor:not-allowed}

/* ── TASK UI ── */
.ti{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:7px;padding:8px 12px;color:var(--t0);font-size:12.5px;margin-bottom:8px}
.ti:focus{border-color:var(--ind)}
.trow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.trow:last-child{border-bottom:none}
.tck{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--bg5);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:var(--trans)}
.tck.d{background:var(--em);border-color:var(--em);color:#000}
.ttx{flex:1;font-size:12px;color:var(--t0)}
.ttx.d{text-decoration:line-through;color:var(--t2)}
.ttag{font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:10px;letter-spacing:.04em;text-transform:uppercase}
.tx{color:var(--t3);cursor:pointer;font-size:15px;transition:var(--trans);padding:0 3px}
.tx:hover{color:var(--ros)}

/* ── HABIT UI ── */
.hrow{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.hrow:last-child{border-bottom:none}
.hname{width:130px;flex-shrink:0}
.hnm{font-size:11.5px;font-weight:500;color:var(--t0)}
.hct{font-size:9px;color:var(--t2)}
.hdays{display:flex;gap:3px}
.hd{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;transition:var(--trans);font-weight:700}
.hd:hover{filter:brightness(1.2);transform:scale(1.08)}
.hdon{background:var(--em);color:#000}
.hmis{background:var(--bg4);color:var(--t3)}
.htod{background:var(--is);color:var(--ind);border:1px solid rgba(99,102,241,.4)}
.hstr{margin-left:auto;text-align:right;min-width:40px}
.hsv{font-size:11.5px;font-weight:700;color:var(--saf)}
.hsl{font-size:8.5px;color:var(--t2)}

/* ── SCHEDULE BLOCKS ── */
.tbr{display:flex;gap:9px;margin-bottom:7px;align-items:stretch}
.tbt{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--t2);width:38px;flex-shrink:0;padding-top:8px}
.tbc{flex:1;border-radius:7px;border-left:3px solid;padding:8px 11px;cursor:pointer;transition:var(--trans)}
.tbc:hover{filter:brightness(1.08)}
.tbcd{border-color:var(--ind);background:var(--is)}
.tbct{border-color:var(--saf);background:var(--ss)}
.tbcb{border-color:var(--em);background:var(--es)}
.tbca{border-color:var(--sky);background:var(--ks)}
.tbcr{border-color:var(--t3);background:var(--bg3)}
.tbcv{border-color:var(--vio);background:var(--vs)}
.tbn{font-size:11.5px;font-weight:600;color:var(--t0)}
.tbd{font-size:10px;color:var(--t1);margin-top:2px}
.tbtg{font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:8px;display:inline-block;margin-top:3px}

/* ── WEEK GRID ── */
.wg{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:14px}
.wdc{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);padding:9px;min-height:120px}
.wdc.tod{border-color:rgba(99,102,241,.4);background:var(--is)}
.wdn{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);text-align:center;margin-bottom:3px}
.wdc.tod .wdn{color:var(--ind)}
.wdnum{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;text-align:center;margin-bottom:6px}
.wdp{font-size:8.5px;padding:2px 5px;border-radius:3px;background:var(--bg4);color:var(--t1);margin-bottom:2px;cursor:pointer;transition:var(--trans)}
.wdp:hover{background:var(--bg5);color:var(--t0)}

/* ── GOAL TREE ── */
.gtree{position:relative;padding-left:16px}
.gtree::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:1px;background:var(--b2)}
.gnode{position:relative;margin-bottom:7px}
.gnode::before{content:'';position:absolute;left:-12px;top:14px;width:9px;height:1px;background:var(--b2)}
.gni{background:var(--bg3);border:1px solid var(--b1);border-radius:7px;padding:9px 12px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:var(--trans)}
.gni:hover{border-color:var(--b2);background:var(--bg4)}
.gmark{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.gntx{font-size:11.5px;font-weight:500;color:var(--t0)}
.gnmt{font-size:9.5px;color:var(--t2);margin-top:1px}
.gntag{margin-left:auto;padding:1px 7px;border-radius:10px;font-size:8.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;flex-shrink:0}

/* ── JOURNAL ── */
.jta{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:7px;padding:10px 12px;color:var(--t0);font-size:12px;resize:vertical;min-height:80px;line-height:1.6}
.jta:focus{border-color:var(--ind)}
.jentry{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.jedate{font-size:9px;color:var(--t2);font-weight:600;margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.jecont{font-size:11.5px;color:var(--t1);line-height:1.7}

/* ── BURNOUT ── */
.gc{position:relative;width:150px;height:90px;margin:0 auto 6px}
.gc svg{width:150px;height:90px}
.gcenter{position:absolute;bottom:0;left:0;right:0;text-align:center}
.gnum{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:800}
.gsub{font-size:9.5px;color:var(--t2)}

/* ── MATRIX ── */
.mx{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;min-height:280px}
.mxc{border-radius:8px;padding:11px;border:1px solid}
.mx1{background:var(--is);border-color:rgba(99,102,241,.2)}.mx2{background:var(--es);border-color:rgba(16,185,129,.2)}
.mx3{background:var(--ss);border-color:rgba(245,158,11,.2)}.mx4{background:var(--rs);border-color:rgba(244,63,94,.2)}
.mxq{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
.mx1 .mxq{color:var(--ind)}.mx2 .mxq{color:var(--em)}.mx3 .mxq{color:var(--saf)}.mx4 .mxq{color:var(--ros)}
.mxi{font-size:10.5px;color:var(--t1);padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05);display:flex;gap:5px;align-items:flex-start}
.mxi:last-child{border-bottom:none}
.mxd{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:5px}

/* Mobile layout: phones in BOTH orientations + small tablets.
   Landscape phones are ~800-930px wide, so 700px was too low and caused the
   desktop layout (sidebar + top tabs) to appear on rotation. */
@media (max-width:1024px), (orientation:landscape) and (max-height:600px){
  body #sb{display:none}
  body .tnav{display:none}
  body.sb-open #sbdrop{display:block}
  body{font-size:14px}
  #top{height:calc(52px + env(safe-area-inset-top))}
  #main{padding:14px 12px calc(84px + env(safe-area-inset-bottom));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .mx{min-height:auto}
  .domain-grid{grid-template-columns:repeat(2,1fr)}
  .hl-grid{grid-template-columns:repeat(4,1fr)}
  .wg{grid-template-columns:1fr;gap:6px}
  .wdc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;text-align:left;padding:9px 11px}
  .wdc .wdn{width:34px}.wdc .wdnum{font-size:15px;width:24px;margin:0}
  .ph{flex-direction:column;gap:10px}
  .ph-a{flex-wrap:wrap}
  .ph-t{font-size:20px}
  .btn{padding:9px 15px;font-size:12px}
  .ti,textarea.jta,select{font-size:14px!important;padding:10px 12px!important}
  .hd{width:32px;height:32px;font-size:12px}
  .hdays{gap:4px}
  .ni,.tnb{padding:10px}
  .hl-cell{padding:10px 4px}
  input[type=range]{height:28px}
  #clk{display:none}
  /* Sidebar becomes a slide-in drawer, opened by the ☰ button */
  body.sb-open #sb{display:flex!important;position:fixed;top:0;left:0;bottom:0;width:min(272px,80vw);z-index:350;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 0 40px rgba(0,0,0,.6);animation:sbin .22s ease}
  @keyframes sbin{from{transform:translateX(-100%)}to{transform:translateX(0)}}
  #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(62px + env(safe-area-inset-bottom));
    background:rgba(14,18,32,.97);backdrop-filter:blur(14px);border-top:1px solid var(--b2);z-index:300;
    padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--t2);transition:var(--trans)}
  .bni.on{color:var(--ind)}
  .bni:active{background:var(--bg3)}
  .bni-ic{font-size:19px;line-height:1}
  .bni-lb{font-size:8.5px;font-weight:700;letter-spacing:.02em}
  #moresheet.on{display:flex;position:fixed;inset:0;background:rgba(8,11,20,.85);backdrop-filter:blur(8px);z-index:400;align-items:flex-end}
  .msheet{background:var(--bg1);border-radius:18px 18px 0 0;border-top:1px solid var(--b2);width:100%;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:78vh;max-height:78dvh;overflow-y:auto}
  .ms-hd{width:36px;height:4px;background:var(--bg5);border-radius:2px;margin:0 auto 16px}
  .ms-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ms-it{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rl);padding:15px 6px;text-align:center;cursor:pointer}
  .ms-it:active{background:var(--bg3)}
  .ms-ic{font-size:20px;margin-bottom:5px}
  .ms-lb{font-size:9.5px;font-weight:600;color:var(--t1)}
}
/* Narrow phones */
@media (max-width:400px){
  .g4{grid-template-columns:1fr 1fr}
  .qrow{grid-template-columns:repeat(4,1fr);gap:6px}
  .qbl{font-size:8.5px}
  .ms-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .brand{display:none}
}
/* Landscape phone: shorter chrome so content still fits */
@media (orientation:landscape) and (max-height:520px){
  #top{height:calc(42px + env(safe-area-inset-top))}
  #bnav{height:calc(50px + env(safe-area-inset-bottom))}
  .bni-ic{font-size:16px}
  .bni-lb{font-size:8px}
  #main{padding-top:12px;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
  .ebadge{display:none}
  body.sb-open #sb{width:min(240px,60vw)}
}
/* Tablet / desktop: two-column grids stay, sidebar can be toggled off */
@media (min-width:1025px) and (max-width:1320px){
  #sb{width:196px}
  .g3{grid-template-columns:repeat(2,1fr)}
}

/* ── SIDEBAR COLLAPSE (all sizes) ── */
#sb{transition:width .22s ease, transform .22s ease}
body.sb-off #sb{display:none!important}
#sbclose{display:none}
@media (max-width:1024px), (orientation:landscape) and (max-height:600px){
  #sbclose{display:flex;align-items:center;gap:8px;margin:10px 10px 0;padding:9px 11px;
    background:var(--bg3);border:1px solid var(--b1);border-radius:9px;color:var(--t1);
    font-size:11.5px;font-weight:600;cursor:pointer}
  #sbclose:active{background:var(--bg4)}
}

<body>

<!-- TOPBAR -->
<div id="top">
  <div id="sbtog" onclick="toggleSidebar()" title="Show/hide menu">☰</div>
  <div id="thtog" onclick="cycleTheme()" title="Switch theme">🌙</div>
  <div class="logo">L</div>
  <div class="brand">Life OS</div>
  <span class="ver">v10</span>
  <div class="sp"></div>
  <div class="tnav" id="tnav"></div>
  <div class="tright">
    <div id="clk"></div>
    <div class="ebadge" id="ebadge" onclick="cycleEnergy()">
      <div class="epulse" id="epulse"></div>
      <span id="elbl">High Energy</span>

    <div class="score-w">

      <div class="sw-bar-bg"><div class="sw-bar" id="lifebar" style="width:0%"></div></div>
      <div class="sw-sub" id="lifesub">Computing…</div>
    </div>
    <div id="sb-nav"></div>
    <div class="sdiv"></div>
    <div class="sb-stats">
      <div class="ngl" style="padding:0 0 3px">Live Metrics</div>
      <div class="ssr"><span class="ssn">Deep Work</span><span class="ssv" style="color:var(--ind)" id="ss-dw">0h 0m</span></div>
      <div class="ssr"><span class="ssn">Tasks Done</span><span class="ssv" style="color:var(--em)" id="ss-td">0/0</span></div>
      <div class="ssr"><span class="ssn">Focus Sessions</span><span class="ssv" style="color:var(--vio)" id="ss-fs">0</span></div>

<script>
/* ═══════════════════════════════════════════════
   LIFE OS v4 — COMPLETE INTELLIGENCE RUNTIME\n   + Activity Tracking Engine (time · focus · energy)
   Layers: Event Store + Metrics + Memory + AI
═══════════════════════════════════════════════ */

// ── PERSISTENCE ENGINE (localStorage) ──────────
const DB = {
  get(k,def=null){try{const v=localStorage.getItem('los_'+k);return v?JSON.parse(v):def}catch{return def}},
  set(k,v){try{localStorage.setItem('los_'+k,JSON.stringify(v))}catch(e){console.warn('DB full',e)}},
  del(k){localStorage.removeItem('los_'+k)}
};

// ── DATE HELPERS ───────────────────────────────
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dkey();
const mondayOf=(d=new Date())=>{const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

  flush(){

  daySummary(k){const d=this.data[k];if(!d)return null;const tot=Object.values(d.panels).reduce((a,b)=>a+b,0);return{total:tot,focusMin:d.focusMin,avgE:d.energyN?d.energySum/d.energyN:null,avgF:d.focusN?d.focusSum/d.focusN:null,panels:d.panels}},
  init(){

  }
};

// Migrate old-format habits (days[7] arrays) → date-anchored logs
function migrateHabits(hs){
  if(!Array.isArray(hs))return[];
  return hs.map(h=>{
    if(h.log)return h;
    const log={},mon=mondayOf();
    (h.days||[]).forEach((v,i)=>{if(v===true)log[dkey(addDays(mon,i))]=true;});
    return{name:h.name,cat:h.cat,log};
  });
}
// Migrate old hourly logs (keyed by hour) → keyed by date|hour
function migrateHourly(hl){
  const out={};
  Object.entries(hl||{}).forEach(([k,v])=>{
    if(k.includes('|'))out[k]=v;
    else out[(v.ts?v.ts.slice(0,10):today())+'|'+k]=v;
  });
  return out;
}

  const label=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  return S.journalEntries.some(e=>e.dk===today()||e.date===label)||DB.get('journalPrompted','')===today();
}
function maybeJournalPrompt(){
  if(!JRCFG.enabled||isTyping())return;
  if(document.getElementById('jr-ov')||document.getElementById('chk-ov')||document.getElementById('hp-ov'))return;
  const now=new Date();
  if(now.getHours()<JRCFG.hour)return;          // not yet time
  if(journalDoneToday())return;                  // already written or dismissed
  showJournalPrompt();
}
function showJournalPrompt(){
  const act=ACT.daySummary(today());
  const done=S.tasks.filter(t=>t.done).length;
  const st=S.screenTime[today()]||{};
  const waste=(st.social||0)+(st.video||0)+(st.ott||0)+(st.news||0);
  const recap=[
    done?`${done} task${done>1?'s':''} completed`:null,
    act&&act.focusMin?`${act.focusMin} min deep focus`:null,
    RW.stars?`${RW.stars} ⭐ total`:null,
    waste?`${Math.floor(waste/60)}h ${waste%60}m on distraction`:null,
  ].filter(Boolean).join(' · ');
  const ov=document.createElement('div');ov.id='jr-ov';
  ov.style.cssText='position:fixed;inset:0;background:rgba(8,11,20,.9);backdrop-filter:blur(8px);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px;';
  ov.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--b2);border-radius:18px;padding:24px 20px;max-width:380px;width:100%;text-align:center;">
    <div style="font-size:26px;margin-bottom:8px;">🌙</div>
    <div style="font-size:9px;font-weight:800;letter-spacing:.14em;color:var(--vio);margin-bottom:8px;">NIGHTLY REFLECTION</div>
    <div style="font-size:14px;color:var(--t0);line-height:1.55;">How did today actually go?</div>
    ${recap?`<div style="margin-top:10px;padding:9px 12px;background:var(--bg3);border-radius:9px;font-size:11px;color:var(--t1);line-height:1.5;">${recap}</div>`:''}
    <div style="font-size:11.5px;color:var(--t2);line-height:1.6;margin-top:10px;">Two minutes now turns a day into data you can learn from.</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:18px;">
      <button class="btn bp" style="padding:12px;" onclick="openJournalFromPrompt()">✍️ Write tonight's journal</button>
      <div style="display:flex;gap:8px;">
        <button class="btn bg" style="flex:1;padding:11px;" onclick="snoozeJournal()">⏱ In 30 min</button>
        <button class="btn bg" style="flex:1;padding:11px;" onclick="dismissJournal()">Skip tonight</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(ov);
  if(navigator.vibrate)try{navigator.vibrate([50,60,50])}catch(e){}
  if(NCFG.notifs&&'Notification'in window&&Notification.permission==='granted'&&document.hidden){
    try{new Notification('Life OS · Nightly Reflection',{body:'How did today go? Two minutes to journal.'});}catch(e){}
  }
}
function closeJournalPrompt(){const o=document.getElementById('jr-ov');if(o)o.remove();}
function openJournalFromPrompt(){closeJournalPrompt();goPanelB('journal');setTimeout(()=>{const el=document.getElementById('jw');if(el)el.focus();},350);}
function snoozeJournal(){closeJournalPrompt();JRCFG.snoozeUntil=Date.now()+30*60*1000;setTimeout(()=>{if(!journalDoneToday())maybeJournalPrompt()},30*60*1000);toast('⏱','Reminder in 30 minutes');}
function dismissJournal(){closeJournalPrompt();DB.set('journalPrompted',today());toast('🌙','Skipped — see you tomorrow');}

// ── INSIGHT ENGINE (100% local, zero cost) ─────
// Correlates the data you already log. This is the "AI feeling" without an API:
// real arithmetic on real behaviour, phrased plainly.
function dayStats(k){
  const act=ACT.daySummary(k);
  const st=S.screenTime[k]||{};
  const sl=S.sleep[k]||{};
  const distract=(st.social||0)+(st.video||0)+(st.ott||0)+(st.news||0);
  const habitsDone=S.habits.filter(h=>h.log[k]).length;
  const tasksDone=S.events.filter(e=>e.type==='task'&&e.ts&&e.ts.startsWith(k)).length;
  return{
    k,energy:act&&act.avgE!==null?act.avgE:null,focusMin:act?act.focusMin:0,
    distract,sleepH:sl.hours||null,sleepQ:sl.quality||null,habitsDone,tasksDone,
    hasData:!!(act||distract||sl.hours||habitsDone||tasksDone)
  };
}
function lastDays(n){
  return [...Array(n)].map((_,i)=>dayStats(dkey(addDays(new Date(),-(n-1-i))))).filter(d=>d.hasData);
}
function splitCompare(days,pred,metric){
  const A=days.filter(d=>pred(d)&&d[metric]!==null&&d[metric]!==undefined);
  const B=days.filter(d=>!pred(d)&&d[metric]!==null&&d[metric]!==undefined);
  if(A.length<2||B.length<2)return null;
  const avg=a=>a.reduce((x,d)=>x+d[metric],0)/a.length;
  const a=avg(A),b=avg(B);
  if(b===0&&a===0)return null;
  const pct=b===0?100:Math.round((a-b)/Math.abs(b)*100);
  return{a,b,pct,nA:A.length,nB:B.length};
}
function buildInsights(){
  const days=lastDays(30);
  const out=[];
  if(days.length<3)return out;
  // Sleep → energy
  const target=parseFloat(PROFILE.sleepTarget||7);
  let r=splitCompare(days.filter(d=>d.sleepH!==null),d=>d.sleepH>=target,'energy');
  if(r&&Math.abs(r.pct)>=5)out.push({icon:'😴',title:'Sleep drives your energy',
    text:`On ${target}h+ nights your energy averages <b>${r.a.toFixed(1)}/10</b>; on shorter nights <b>${r.b.toFixed(1)}/10</b> — <b>${r.pct>0?'+':''}${r.pct}%</b>.`,
    action:r.pct>0?`Protect ${target} hours. It is your cheapest performance gain.`:'',n:r.nA+r.nB});
  // Sleep → focus minutes
  r=splitCompare(days.filter(d=>d.sleepH!==null),d=>d.sleepH>=target,'focusMin');
  if(r&&r.pct>=15)out.push({icon:'🎯',title:'Sleep buys you deep work',
    text:`Well-slept days average <b>${Math.round(r.a)} min</b> of deep focus vs <b>${Math.round(r.b)} min</b> — <b>+${r.pct}%</b>.`,n:r.nA+r.nB});
  // Habits → energy
  r=splitCompare(days,d=>d.habitsDone>=Math.max(1,Math.ceil(S.habits.length*0.6)),'energy');
  if(r&&Math.abs(r.pct)>=5)out.push({icon:'✦',title:'Your routine shows up in your energy',
    text:`Days you keep most habits: energy <b>${r.a.toFixed(1)}/10</b> vs <b>${r.b.toFixed(1)}/10</b> when you don't — <b>${r.pct>0?'+':''}${r.pct}%</b>.`,n:r.nA+r.nB});
  // Distraction → tasks done
  const withScreen=days.filter(d=>d.distract>0);
  r=splitCompare(withScreen,d=>d.distract<=120,'tasksDone');
  if(r&&Math.abs(r.pct)>=10)out.push({icon:'📱',title:'Phone time costs you completions',
    text:`Under 2h distraction: <b>${r.a.toFixed(1)} tasks</b> done. Over 2h: <b>${r.b.toFixed(1)}</b> — <b>${r.pct>0?'+':''}${r.pct}%</b>.`,
    action:r.pct>0?'Cutting 30 min of scrolling is worth more than an extra hour awake.':'',n:r.nA+r.nB});
  // Peak hour
  const byHour={};
  Object.entries(S.hourlyLog).forEach(([k,v])=>{const h=(k.split('|')[1]||'');if(h)(byHour[h]=byHour[h]||[]).push(v.energy);});
  const hrs=Object.entries(byHour).filter(([,a])=>a.length>=2)
    .map(([h,a])=>({h,avg:a.reduce((x,y)=>x+y,0)/a.length,n:a.length})).sort((a,b)=>b.avg-a.avg);
  if(hrs.length>=3){
    const p=hrs[0],w=hrs[hrs.length-1];
    out.push({icon:'⚡',title:'Your peak and your dip',
      text:`Strongest at <b>${p.h}:00</b> (${p.avg.toFixed(1)}/10), weakest at <b>${w.h}:00</b> (${w.avg.toFixed(1)}/10).`,
      action:`Put your hardest work at ${p.h}:00 and admin or rest at ${w.h}:00.`,n:hrs.reduce((a,x)=>a+x.n,0)});
  }
  // Best weekday
  const byDow={};
  days.forEach(d=>{const dw=new Date(d.k+'T00:00:00').getDay();(byDow[dw]=byDow[dw]||[]).push(d.tasksDone);});
  const dws=Object.entries(byDow).filter(([,a])=>a.length>=2)
    .map(([dw,a])=>({dw:+dw,avg:a.reduce((x,y)=>x+y,0)/a.length})).sort((a,b)=>b.avg-a.avg);
  if(dws.length>=4&&dws[0].avg>0){
    const N=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    out.push({icon:'📅',title:'Your strongest day',
      text:`<b>${N[dws[0].dw]}</b> is your most productive day (${dws[0].avg.toFixed(1)} tasks); <b>${N[dws[dws.length-1].dw]}</b> your quietest.`,
      action:`Schedule the week's hardest task on ${N[dws[0].dw]}.`,n:days.length});
  }
  // Consistency streak
  const logged=days.length;
  out.push({icon:'📊',title:'Your data so far',
    text:`<b>${logged} day${logged>1?'s':''}</b> logged. ${logged<7?'A week of data unlocks the strongest patterns.':logged<21?'Three weeks unlocks weekday and sleep patterns.':'Enough history for reliable patterns.'}`,n:logged});
  return out;
}

function checkFollowUps(){

function addRecurring(it){
  if(S.recurring.some(r=>r.text===it.text&&r.rule===it.recur))return;
  S.recurring.push({text:it.text,cat:it.cat,pri:it.pri,due:it.due||'',remind:it.remind||'',rule:it.recur});
  DB.set('recurring',S.recurring);
}
function recurMatchesToday(rule){
  const d=new Date().getDay(); // 0=Sun
  if(rule==='daily')return true;
  if(rule==='weekdays')return d>=1&&d<=5;
  const map={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
  return map[rule]===d;
}
function generateRecurring(){
  const tk=today();
  if(DB.get('recurGen','')===tk)return;
  let n=0;
  S.recurring.forEach(r=>{
    if(!recurMatchesToday(r.rule))return;
    // skip if an identical open task already exists
    if(S.tasks.some(t=>t.text===r.text&&!t.done))return;
    const id=S.nextTaskId++;
    S.tasks.push({id,text:r.text,cat:r.cat,pri:r.pri,done:false,ts:Date.now(),due:r.due,recur:r.rule});
    if(r.remind)scheduleReminder(id,r.text,r.remind);
    n++;
  });
  DB.set('recurGen',tk);
  if(n){save();toast('↻',`${n} recurring task${n>1?'s':''} added for today`);}
}

function aiKey(){return DB.get('aiKey','')}
async function aiCall(messages,maxTokens){
  const key=aiKey();
  const headers={'Content-Type':'application/json'};
  if(key){headers['x-api-key']=key;headers['anthropic-version']='2023-06-01';headers['anthropic-dangerous-direct-browser-access']='true';}
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,
    body:JSON.stringify({model:'claude-haiku-4-5',max_tokens:maxTokens||1200,messages})});
  if(!res.ok)throw new Error('AI '+res.status);
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
const AI_PARSE_PROMPT=()=>`You are the intake brain of a personal assistant app. Convert the user's brain-dump (may be voice-transcribed, messy, Indian English) into a JSON array. Each element:
{"type":"task"|"goal"|"idea"|"memory"|"expense"|"journal","text":"clean imperative phrasing, no time words","due":"HH:MM 24h or \"\"","remind":"HH:MM or \"\"","pri":1|2|3,"cat":"deep|work|trade|admin|body|learn|mind|family|home|money|personal","recur":"daily|weekdays|mon|tue|wed|thu|fri|sat|sun|\"\""}
Routing: something to DO becomes task; an aspiration becomes goal; a product or business thought becomes idea; a fact about a person worth remembering becomes memory; money spent becomes expense (include numeric amount); a feeling or reflection on the day becomes journal.\nRules: separate a task's own time from its reminder/alarm time. "morning"≈08:00, "afternoon"≈15:00, "evening"≈18:00, "night"≈21:00 only when no clock time given. "set reminder" with no time → 15 min before due. urgent/must/important → pri 1; someday/later → pri 3; else 2. exercise/gym→body, kids/school/family→family, groceries/household→home, doctor→personal, class/study→learn, meeting/office→work, trading/market→trade, pay/EMI/tax→money. Today is ${today()}. Respond ONLY with the JSON array, no markdown, no commentary.
INPUT:
`;
function sanitizeParsed(arr){
  const T=v=>{const m=/^(\d{2}):(\d{2})$/.exec(v||'');return !!m&&+m[1]<=23&&+m[2]<=59;};
  if(!Array.isArray(arr))return null;
  const out=arr.map((x,i)=>({
    id:i,include:true,
    type:['task','goal','idea','memory','expense','journal'].includes(x.type)?x.type:'task',
    amount:(typeof x.amount==='number'&&x.amount>0)?x.amount:0,
    text:String(x.text||'').slice(0,200).trim(),
    due:T(x.due)?x.due:'',
    remind:T(x.remind)?x.remind:'',
    pri:[1,2,3].includes(x.pri)?x.pri:2,
    cat:CATS[x.cat]?x.cat:'personal',
    recur:['daily','weekdays','mon','tue','wed','thu','fri','sat','sun'].includes(x.recur)?x.recur:'',
    day:/^\d{4}-\d{2}-\d{2}$/.test(x.day||'')?x.day:'',mins:0,
    raw:String(x.text||'')
  })).filter(x=>x.text.length>1);
  return out.length?out:null;
}
async function smartParse(text){
  try{
    const key=aiKey();
    if(!key&&location.hostname!=='localhost')return null;   // deployed without key → local engine
    const raw=await aiCall([{role:'user',content:AI_PARSE_PROMPT()+text}],1500);
    const clean=raw.replace(/```json|```/g,'').trim();
    return sanitizeParsed(JSON.parse(clean));
  }catch(e){return null;}
}

// Fires while the app is open (and via notification if granted + backgrounded).
// A closed PWA cannot be woken — that needs the native build.
function scheduleReminder(taskId,text,hhmmStr,dayKey){
  if(!hhmmStr)return;
  const [h,m]=hhmmStr.split(':').map(Number);
  const at=dayKey?new Date(dayKey+'T00:00:00'):new Date();
  at.setHours(h,m,0,0);
  if(!dayKey&&at.getTime()<Date.now()-60000)at.setDate(at.getDate()+1);
  S.reminders.push({id:Date.now()+Math.random(),taskId,text,at:at.getTime(),fired:false});
  DB.set('reminders',S.reminders);
}
function checkReminders(){
  const now=Date.now();let changed=false;
  S.reminders.forEach(r=>{
    if(r.fired||r.at>now||now-r.at>30*60*1000)return;
    r.fired=true;changed=true;
    showReminder(r);
  });
  if(changed){
    S.reminders=S.reminders.filter(r=>!r.fired||now-r.at<24*3600*1000);
    DB.set('reminders',S.reminders);
  }
}

// ── DATE PHRASE PARSING (local, no API) ────────
const DOW={sunday:0,sun:0,monday:1,mon:1,tuesday:2,tue:2,tues:2,wednesday:3,wed:3,thursday:4,thu:4,thurs:4,friday:5,fri:5,saturday:6,sat:6};
// "in 30 minutes" / "in next 2 hours" / "after 45 mins" → an actual clock time
function parseRelativeTime(line){
  const m=normalizeSpeech(line).toLowerCase().match(/\b(?:in|after|within)\s+(?:the\s+)?(?:next\s+)?(\d{1,3})\s*(min|mins|minute|minutes|hr|hrs|hour|hours)\b/);
  if(!m)return null;
  const n=+m[1],mins=/^h/.test(m[2])?n*60:n;
  if(mins<1||mins>24*60)return null;
  const d=new Date(Date.now()+mins*60000);
  return{h:d.getHours(),mi:d.getMinutes()};
}
function parseDayPhrase(line){
  const l=line.toLowerCase();
  if(/\btomorrow\b|\btmrw\b/.test(l))return dkey(addDays(new Date(),1));
  if(/\bday after tomorrow\b/.test(l))return dkey(addDays(new Date(),2));
  if(/\btoday\b|\btonight\b/.test(l))return today();
  const nx=l.match(/\bnext\s+(sunday|sun|monday|mon|tuesday|tues|tue|wednesday|wed|thursday|thurs|thu|friday|fri|saturday|sat)\b/);
  const on=l.match(/\b(?:on\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
  const pick=nx?nx[1]:(on?on[1]:null);
  if(pick){
    const target=DOW[pick],cur=new Date().getDay();
    let delta=(target-cur+7)%7;
    if(delta===0)delta=7;                 // "on friday" said on a Friday → next week
    if(nx&&delta<7&&(target-cur+7)%7===0)delta=7;
    return dkey(addDays(new Date(),delta));
  }
  const inD=l.match(/\bin\s+(\d{1,2})\s+days?\b/);
  if(inD)return dkey(addDays(new Date(),+inD[1]));
  return '';
}
function parseDuration(line){
  const m=line.toLowerCase().match(/\b(?:for\s+)?(\d{1,3})\s*(min|mins|minutes?|hrs?|hours?)\b/);
  if(!m)return 0;
  const n=+m[1];
  return /h/.test(m[2])?n*60:n;
}
const dayLabel=k=>{
  if(!k||k===today())return '';
  const t=dkey(addDays(new Date(),1));
  if(k===t)return 'Tomorrow';
  const d=new Date(k+'T00:00:00');
  return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
};

// ── NATURAL LANGUAGE CAPTURE ENGINE ────────────
// Turns a spoken/typed brain-dump into structured tasks, goals, ideas and
// reminders. Everything is shown as an editable preview before it is saved.
const CAT_HINTS=[
  {c:'body',  w:['exercise','workout','gym','run','walk','yoga','jog','swim','cycle','training','asana','pranayama','stretch']},
  {c:'family',w:['kids','kid','child','school','wife','husband','mom','dad','mother','father','family','parents','birthday','pick up','drop']},
  {c:'home',  w:['vegetable','vegetables','grocery','groceries','supermarket','instamart','blinkit','zepto','swiggy','cooking oil','milk','cook','clean','laundry','repair','bill','rent','maid','plumber','electrician','gas cylinder','water can']},
  {c:'personal',w:['doctor','dentist','appointment','medicine','tablet','hospital','clinic','haircut','checkup','vaccine','test','scan','pharmacy','temple','pooja']},
  {c:'learn', w:['music class','class','study','course','learn','reading','read','practice','tuition','lesson']},
  {c:'work',  w:['meeting','client','office','report','presentation','email','call','deadline','standup','review with']},
  {c:'trade', w:['trade','trading','market','chart','stock','nifty','backtest','screener','position']},
  {c:'mind',  w:['meditate','meditation','sadhana','journal','reflect','breathe','stillness']},
  {c:'money', w:['pay','payment','emi','insurance','tax','invest','sip','budget','bank']},
  {c:'admin', w:['book','ticket','renew','submit','form','document','license','courier']},
];
const P1_WORDS=['urgent','asap','must','important','critical','priority','p1','today only','deadline'];
const P3_WORDS=['someday','later','sometime','eventually','if time','optional','p3','low priority'];
const GOAL_WORDS=['goal','my goal','i want to','aim to','target','achieve','by end of','this year','this month','this quarter'];
const IDEA_WORDS=['idea','note down','note that','remember that','thought','remind me that','insight','learn that'];

function allTimes(str){
  const out=[];
  // 4.45am · 7:45 pm · 15:30
  let re=/\b(\d{1,2})[:.](\d{2})\s*(a\.?m\.?|p\.?m\.?)?/gi,m;
  while((m=re.exec(str))){
    let h=+m[1],mi=+m[2];const ap=(m[3]||'').toLowerCase().replace(/\./g,'');
    if(ap==='pm'&&h<12)h+=12; if(ap==='am'&&h===12)h=0;
    if(h<=23&&mi<=59)out.push({h,mi,raw:m[0],idx:m.index});
  }
  // 5AM · 11 am · 3pm  (skip ones already captured above)
  re=/\b(\d{1,2})\s*(a\.?m\.?|p\.?m\.?)/gi;
  while((m=re.exec(str))){
    if(out.some(t=>m.index>=t.idx&&m.index<t.idx+t.raw.length))continue;
    let h=+m[1];const ap=m[2].toLowerCase().replace(/\./g,'');
    if(ap==='pm'&&h<12)h+=12; if(ap==='am'&&h===12)h=0;
    if(h<=23)out.push({h,mi:0,raw:m[0],idx:m.index});
  }
  out.sort((a,b)=>a.idx-b.idx);
  if(out.length)return out;
  // vague words only if no clock time at all
  const vm=/\b(morning|afternoon|evening|night|noon)\b/i.exec(str);
  if(vm){const map={morning:[8,0],noon:[12,0],afternoon:[15,0],evening:[18,0],night:[21,0]};
    const v=map[vm[1].toLowerCase()];return[{h:v[0],mi:v[1],raw:'',idx:vm.index,vague:true}];}
  return[];
}
const hhmm=t=>String(t.h).padStart(2,'0')+':'+String(t.mi).padStart(2,'0');
function normalizeSpeech(t){
  return String(t||'')
    .replace(/\r/g,'')
    .replace(/\b([ap])\.\s*m\.?/gi,'$1m')          // "p. m." / "p.m." → "pm"
    .replace(/\brupees?\b|\brs\.?\b|₹/gi,'₹')
    .replace(/\s{2,}/g,' ');
}
// Junk that voice transcription adds around real content
const NOISE_LEAD=/^(?:and|also|so|then|next|ok|okay|um+|uh+|actually|basically|address|plus|after that|number)\b[\s,.-]*/i;
const META_LINE=/^(?:i am going to|i'm going to|let me|these are|here are|listing|list of|i want to list|my list|to sorry|sorry|ok|okay)\b[\s\S]{0,20}$/i;
// "Hey I am going to give three tasks and one idea" — an announcement, not an item
const ANNOUNCE=/^(?:hey|hi|hello|ok|okay|so)?\s*(?:i\s*(?:am|'m)\s*going\s*to|i\s*will|let\s*me)\s*(?:give|list|tell|share|say|add|note)\b[\s\S]{0,60}\b(?:task|tasks|idea|ideas|item|items|point|points|thing|things)\b/i;
function splitDump(text){
  let t=normalizeSpeech(text);
  // 1) Explicit spoken item markers: "task 1", "task number 3", "item 2", "point two"
  t=t.replace(/\b(?:task|item|point|thing|number)\s*(?:number\s*)?(?:\d{1,2}|one|two|three|four|five|six|seven|eight|nine|ten)\b/gi,'\n');
  // 2) Ordinal openers: "first, ... second, ... thirdly ..."
  t=t.replace(/\b(?:first|second|third|fourth|fifth|sixth)(?:ly)?\b(?=[\s,:-])/gi,'\n');
  // 3) Spoken connectors that start a new item
  t=t.replace(/\s+(?:and then|then next|after that|also i need to|also need to|and also|one more thing|another thing|next i need to|apart from that)\s+/gi,'\n');
  // 3b) A new "idea …" clause starts a new item
  t=t.replace(/(?<!\b(?:a|an|the|my|our|his|her|this|that|one|another|new|good|great|business|small))\s+(?=(?:idea|ideas)\s+(?:regarding|about|for|is|on)\b)/gi,'\n');
  // 4) Bullets / numbered lists
  t=t.replace(/\s*(?:•|·|—|\d{1,2}[\).])\s+/g,'\n');
  // 5) Sentence boundary — but only when the NEXT sentence looks like a new item
  //    (has its own time or starts with an action verb) and isn't a reminder clause
  //    that belongs to the sentence before it.
  t=t.split(/(?<=[.!?])\s+/).map(sent=>sent.trim()).filter(Boolean).map((sent,i,arr)=>sent).join('\n');
  return t.split(/\n+/)
    .map(x=>x.trim().replace(NOISE_LEAD,'').replace(/^[\s,.:;-]+|[\s,;:-]+$/g,'').trim())
    .filter(x=>x.length>2)
    .filter(x=>!(META_LINE.test(x)&&!allTimes(x).length))
    .filter(x=>!(ANNOUNCE.test(x)&&!allTimes(x).length))     // drop "I am going to list three tasks"
    .filter(x=>x.split(/\s+/).length>=2||allTimes(x).length)  // drop stray fragments
    .reduce((acc,cur)=>{
      // A pure reminder clause belongs to the previous item, not its own task
      const bareReminder=/^(?:so\s+)?(?:remind me|set (?:an? )?(?:reminder|alarm)|alarm)\s+(?:at|for)\s/i.test(cur)
        && allTimes(cur).length>0 && cur.split(/\s+/).length<=8;
      if(acc.length&&bareReminder){acc[acc.length-1]+=' '+cur;return acc;}
      return acc.concat(cur);
    },[]);
}
function cleanExpenseText(line){
  let t=normalizeSpeech(line)
    .replace(/\u20b9\s*\d[\d,]*(?:\.\d{1,2})?/g,' ')
    .replace(/\b\d[\d,]{1,7}(?:\.\d{1,2})?\b/g,' ')
    .replace(/\b(?:i\s+)?(?:spent|spend|paid|pay|bought|purchased|cost|costs)\b/gi,' ')
    .replace(/^\s*(?:on|for|at|in|to)\s+/i,'')
    .replace(/\s{2,}/g,' ').replace(/^[\s,.-]+|[\s,.-]+$/g,'').trim();
  return t?t.charAt(0).toUpperCase()+t.slice(1):'Expense';
}
function cleanTaskText(line,times){
  let t=line;
  t=t.replace(/\s*(?:task|item|point|number)?\s*(?:number\s*)?(?:to\s+)?sorry\b.*$/i,' ');  // voice self-correction
  t=t.replace(/^(?:i|we)\s+(?:have|has|had|need|want|will|must|should|am|are|was|going)\s+(?:to\s+|an?\s+|got\s+to\s+)?/i,'');
  t=t.replace(/\bthat\s+is\s+(?:around|about|at)\b/gi,' ');
  t=t.replace(/\b(?:in|after|within)\s+(?:the\s+)?(?:next\s+)?\d{1,3}\s*(?:min|mins|minute|minutes|hr|hrs|hour|hours)\b/gi,' ');
  (times||[]).forEach(x=>{if(x&&x.raw)t=t.split(x.raw).join(' ');});
  t=t.replace(/\b(set\s+(?:an?\s+)?(?:reminder|alarm)(?:\s+(?:at|for))?|remind\s+me(?:\s+(?:at|to))?)\b/gi,' ');
  t=t.replace(/^\s*(?:set\s+(?:an?|the)\s+)/i,'');
  t=t.replace(/\b(?:please|kindly|i\s+)?\b(?:need(?:\s+to)?|have\s+to|want\s+to|should|must|gotta|got\s+to|make\s+sure(?:\s+to)?)\b/gi,' ');
  t=t.replace(/\b(?:at|by|on|around|from)\s*(?=[,.\-–]|$)/gi,' ');
  for(let i=0;i<3;i++)t=t.replace(/\s+(?:so|and|also|then|at|for|to|the|a|an|is|around|about)\s*$/i,'');
  t=t.replace(/[\s,.\-–:]+$/,'').replace(/^[\s,.\-–:]+/,'').replace(/\s{2,}/g,' ').trim();
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function detectCat(line){
  const l=line.toLowerCase();
  for(const g of CAT_HINTS)if(g.w.some(w=>l.includes(w)))return g.c;
  return 'personal';
}
function detectPri(line){
  const l=line.toLowerCase();
  if(P1_WORDS.some(w=>l.includes(w)))return 1;
  if(P3_WORDS.some(w=>l.includes(w)))return 3;
  return 2;
}
// Money: 700 rupees, Rs 700, Rs.700 — normalizeSpeech turns all into the rupee sign
function parseAmount(line){
  const n=normalizeSpeech(line);
  let m=n.match(/\u20b9\s*(\d[\d,]*(?:\.\d{1,2})?)|\b(\d[\d,]*(?:\.\d{1,2})?)\s*\u20b9/);
  if(m)return parseFloat((m[1]||m[2]).replace(/,/g,''));
  // bare number, but only when the sentence is clearly about spending and has no clock time
  if(/\b(spent|spend|paid|pay|bought|purchased|cost|costs|recharge|bill)\b/i.test(n)&&!allTimes(n).length){
    m=n.match(/\b(\d[\d,]{1,7}(?:\.\d{1,2})?)\b/);
    if(m)return parseFloat(m[1].replace(/,/g,''));
  }
  return 0;
}
const SPEND_W=['spent','spend','paid','bought','purchased','cost','bill','recharge','fare','emi','fees','fee'];
const FEEL_W=['i feel','i am feeling','feeling','i felt','today was','today i','good day','bad day','tired','exhausted','drained','happy','stressed','anxious','grateful','frustrated','proud of','went well','productive day'];
const MEM_W=['likes','loves','prefers','birthday','anniversary','remember that','favourite','favorite','allergic','hates','is good at','dreams of','told me','interested in'];
const ACTION_W=['remind','call','buy','pick','drop','send','pay','book','submit','renew','collect','finish','complete','clean','wash','fix','meet','attend','turn off','turn on','check','email','order','visit','apply','file','schedule','print'];
function detectType(line){
  const l=normalizeSpeech(line).toLowerCase().trim();
  const hasAction=ACTION_W.some(w=>l.includes(w));
  // 1 Expense — an amount plus a spending verb
  if(parseAmount(line)>0&&SPEND_W.some(w=>l.includes(w)))return 'expense';
  // 2 Explicit idea
  if(/\b(i have an idea|idea for|idea about|idea regarding|idea is|idea on|new idea|concept for|what if we|thought of)\b/.test(l)||/^ideas?\b/.test(l))return 'idea';
  // 3 Explicit goal
  if(GOAL_WORDS.some(w=>l.startsWith(w))||/\b(my goal|i want to become|i aim to|by end of)\b/.test(l))return 'goal';
  // 4 Journal — a feeling or reflection, with nothing to do in it
  if(FEEL_W.some(w=>l.includes(w))&&!hasAction)return 'journal';
  // 5 Memory — a fact about someone, not a task
  if(MEM_W.some(w=>l.includes(w))&&!hasAction&&!/\bremind me\b/.test(l))return 'memory';
  if(IDEA_WORDS.some(w=>l.startsWith(w)))return 'idea';
  return 'task';
}
function parseBrainDump(text){
  return splitDump(text).map((line,i)=>{
    const times=allTimes(line);
    // Where does a reminder/alarm instruction begin?
    const remPhrase=/\b(?:set\s+(?:an?\s+)?(?:reminder|alarm)|remind\s+me|alarm)\b/i.exec(line);
    let due=null,remind=null;
    if(remPhrase){
      const at=remPhrase.index;
      // reminder time = first time appearing at/after the phrase
      remind=times.find(t=>t.idx>=at&&!t.vague)||null;
      // task time = first time BEFORE the phrase
      due=times.find(t=>t.idx<at&&!t.vague)||null;
      if(!due&&remind){
        const other=times.filter(t=>t!==remind&&!t.vague);
        due=other[0]||null;
      }
    }else{
      due=times.find(t=>!t.vague)||times[0]||null;
    }
    if(!due&&times.length)due=times[0];
    if(!due||due.vague){const rel=parseRelativeTime(line);if(rel)due=rel;}
    // "set reminder" with no explicit time → 15 minutes before the task
    if(remPhrase&&!remind&&due&&!due.vague){
      let mm=due.h*60+due.mi-15; if(mm<0)mm+=1440;
      remind={h:Math.floor(mm/60),mi:mm%60};
    }
    if(remind&&due&&!due.vague){
      const dm=due.h*60+due.mi;let rm=remind.h*60+remind.mi;
      if(dm-rm>12*60){rm+=12*60;if(rm<24*60)remind={h:Math.floor(rm/60),mi:rm%60};}   // "8:45" meant 20:45
      else if(rm>dm&&rm-dm<12*60&&remind.h<12&&due.h>=12){/* keep */}
    }
    if(remind&&due&&remind.h===due.h&&remind.mi===due.mi)remind=null;
    // Strip every recognised time + the reminder clause from the display text
    let body=line;
    if(remPhrase){
      const tail=remind&&remind.raw?remind.idx+remind.raw.length:line.length;
      body=line.slice(0,remPhrase.index)+' '+line.slice(Math.max(tail,remPhrase.index));
    }
    const type=detectType(line);
    return{
      id:i,include:true,type,
      text:cleanTaskText(body,times)||line,
      due:due&&!due.vague?hhmm(due):(due&&due.vague?hhmm(due):''),
      vague:!!(due&&due.vague),
      remind:remind?hhmm(remind):'',
      pri:detectPri(line),cat:detectCat(line),
      day:parseDayPhrase(line),mins:parseDuration(line),amount:parseAmount(line),
      recur:(()=>{const ll=line.toLowerCase();return ll.match(/\b(daily|every\s?day|everyday)\b/)?'daily':ll.match(/\bweekdays\b/)?'weekdays':(ll.match(/\bevery\s+(sun|mon|tue|wed|thu|fri|sat)/)||[])[1]||'';})(),
      raw:line
    };
  }).filter(x=>x.text.length>1);
}

// ── VOICE INPUT ENGINE ─────────────────────────
// Web Speech API. Works in Chrome/Android and Safari/iOS 14.5+ over HTTPS.
// Dictated text is appended to whatever field the mic button targets.
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const VOICE_OK=!!SR;
let recog=null,recogTarget=null,recogBtn=null,recogBase='',recogOnEnd=null;
function micBtn(targetId,opts){
  if(!VOICE_OK)return '';
  const o=opts||{};
  return `<span class="micb" id="mic-${targetId}" title="Speak instead of typing"
    onclick="toggleDictation('${targetId}',${o.continuous?'true':'false'})">🎤</span>`;
}
function toggleDictation(targetId,continuous){
  if(recog&&recogTarget===targetId){stopDictation();return;}
  if(recog)stopDictation();
  startDictation(targetId,continuous);
}
function startDictation(targetId,continuous){
  const el=document.getElementById(targetId);
  if(!el)return;
  if(!VOICE_OK){toast('⚠️','Voice input needs Chrome or Safari (iOS 16+)');return;}
  try{
    recog=new SR();
    recog.lang=DB.get('voiceLang','en-IN');
    recog.interimResults=true;
    recog.continuous=!!continuous;
    recogTarget=targetId;recogBase=el.value?el.value.trim()+' ':'';
    recogBtn=document.getElementById('mic-'+targetId);
    if(recogBtn)recogBtn.classList.add('rec');
    el.placeholder='🎙 Listening…';
    recog.onresult=e=>{
      let final='',interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript;
        if(e.results[i].isFinal)final+=t+' ';else interim+=t;
      }
      if(final)recogBase+=final;
      el.value=(recogBase+interim).replace(/\s+/g,' ').trimStart();
      el.dispatchEvent(new Event('input',{bubbles:true}));
      if(el.tagName==='TEXTAREA')el.scrollTop=el.scrollHeight;
    };
    recog.onerror=ev=>{
      stopDictation();
      if(ev.error==='not-allowed')toast('🎤','Microphone blocked — allow it in browser settings');
      else if(ev.error==='no-speech')toast('🎤','Didn\'t catch that — try again');
      else toast('🎤','Voice error: '+ev.error);
    };
    recog.onend=()=>{const cb=recogOnEnd;stopDictation();if(cb)cb();};
    recog.start();
    if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}
  }catch(e){toast('⚠️','Could not start voice input');stopDictation();}
}
function stopDictation(){
  if(recog){try{recog.onend=null;recog.stop();}catch(e){}}
  if(recogBtn)recogBtn.classList.remove('rec');
  const el=recogTarget?document.getElementById(recogTarget):null;
  if(el&&el.placeholder==='🎙 Listening…')el.placeholder=el.dataset.ph||'';
  recog=null;recogTarget=null;recogBtn=null;recogBase='';recogOnEnd=null;
}

// ── THEME ENGINE ───────────────────────────────
// 'dark' · 'light' · 'auto' (follows the system setting, and falls back to
// clock-based day/night when the OS gives no preference).
const THEME=DB.get('theme','dark');
let themeMode=THEME;
function resolveTheme(mode){
  if(mode==='light'||mode==='dark')return mode;
  try{
    if(window.matchMedia){
      if(window.matchMedia('(prefers-color-scheme: light)').matches)return 'light';
      if(window.matchMedia('(prefers-color-scheme: dark)').matches)return 'dark';
    }
  }catch(e){}
  const h=new Date().getHours();          // no OS preference → use time of day
  return (h>=7&&h<19)?'light':'dark';
}
function applyTheme(mode){
  themeMode=mode;DB.set('theme',mode);
  const eff=resolveTheme(mode);
  document.documentElement.setAttribute('data-theme',eff);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',eff==='light'?'#ffffff':'#0a0d17');
  const t=document.getElementById('thtog');
  if(t){t.textContent=mode==='auto'?'🌗':(eff==='light'?'☀️':'🌙');t.title='Theme: '+mode+' (tap to change)';}
}
function cycleTheme(){
  const order=['dark','light','auto'],next=order[(order.indexOf(themeMode)+1)%3];
  applyTheme(next);toast(next==='auto'?'🌗':next==='light'?'☀️':'🌙','Theme: '+next);
  if(S.panel==='settings')renderSettings();
}
function initTheme(){
  applyTheme(themeMode);
  try{
    if(window.matchMedia){
      const mq=window.matchMedia('(prefers-color-scheme: light)');
      const h=()=>{if(themeMode==='auto')applyTheme('auto')};
      mq.addEventListener?mq.addEventListener('change',h):mq.addListener(h);
    }
  }catch(e){}
  setInterval(()=>{if(themeMode==='auto')applyTheme('auto')},10*60*1000);
}

// ── STORAGE MANAGEMENT ─────────────────────────
const LS_LIMIT=5*1024*1024; // conservative browser floor (~5MB)
function storageBytes(){
  let t=0;
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('los_'))t+=(k.length+(localStorage.getItem(k)||'').length)*2;}
  return t;
}
function storagePct(){return Math.min(100,Math.round(storageBytes()/LS_LIMIT*100));}
function fmtBytes(b){return b>1024*1024?(b/1024/1024).toFixed(2)+' MB':(b/1024).toFixed(0)+' KB';}
function daysOfData(){
  const keys=new Set();
  Object.keys(S.hourlyLog).forEach(k=>keys.add(k.split('|')[0]));
  Object.keys(S.screenTime).forEach(k=>keys.add(k));
  Object.keys(ACT.data).forEach(k=>keys.add(k));
  return keys.size;
}
// Trim data older than N days (events, hourly logs, completed tasks) — daily records
// like screen time, habits and activity summaries are tiny and always kept.
function archiveOlderThan(days){
  const cutoff=dkey(addDays(new Date(),-days));
  const cutMs=addDays(new Date(),-days).getTime();
  const before=storageBytes();
  S.events=S.events.filter(e=>!e.ts||e.ts.slice(0,10)>=cutoff);
  Object.keys(S.hourlyLog).forEach(k=>{if(k.split('|')[0]<cutoff)delete S.hourlyLog[k];});
  S.tasks=S.tasks.filter(t=>!t.done||!t.ts||t.ts>=cutMs);
  S.journalEntries=S.journalEntries.slice(0,180);
  save();
  const freed=before-storageBytes();

  const t=topPriorityTask();

// Desktop: collapses the sidebar (remembered). Mobile: opens it as a drawer.
const isMobileLayout=()=>{
  try{if(window.matchMedia)return window.matchMedia('(max-width:1024px), (orientation:landscape) and (max-height:600px)').matches;}catch(e){}
  const w=window.innerWidth,h=window.innerHeight;   // fallback for old browsers
  return w<=1024||(w>h&&h<=600);
};
function setTogIcon(){
  const b=document.getElementById('sbtog');if(!b)return;
  const visible=isMobileLayout()?document.body.classList.contains('sb-open')

  b.textContent=visible?'←':'☰';
  b.title=visible?'Hide menu':'Show menu';
}
function toggleSidebar(){
  if(isMobileLayout()){
    const open=document.body.classList.toggle('sb-open');
    document.getElementById('sbdrop').classList.toggle('on',open);
  }else{
    const off=document.body.classList.toggle('sb-off');
    DB.set('sbOff',off);
  }
  setTogIcon();
}
function closeSidebarDrawer(){
  document.body.classList.remove('sb-open');
  const dp=document.getElementById('sbdrop');if(dp)dp.classList.remove('on');
  setTogIcon();
}
// ── ORIENTATION / RESIZE HANDLING ──────────────
// Rotating a phone changed the matched media query and left stale layout state
// (sidebar + bottom bar both visible, header clipped under the status bar).
// Re-sync classes and re-render the active panel on every viewport change.
let rzT=null,lastVW=window.innerWidth,lastLandscape=window.innerWidth>window.innerHeight;
function syncLayout(){
  if(isMobileLayout()){
    document.body.classList.remove('sb-off');   // drawer mode owns visibility
  }else{
    closeSidebarDrawer();                        // no drawer on desktop
    if(DB.get('sbOff',false))document.body.classList.add('sb-off');
  }
  document.documentElement.style.setProperty('--vh',window.innerHeight*0.01+'px');
  setTogIcon();
}
function isTyping(){
  const a=document.activeElement;
  return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'||a.isContentEditable);
}
function onViewportChange(){
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    const vw=window.innerWidth,landscape=vw>window.innerHeight;
    const widthChanged=Math.abs(vw-lastVW)>40;
    const rotated=landscape!==lastLandscape;
    // Height-only changes = soft keyboard opening/closing or browser chrome
    // collapsing. Never re-render for those; it would kill the keyboard.
    if(!widthChanged&&!rotated)return;
    if(isTyping())return;
    lastVW=vw;lastLandscape=landscape;
    syncLayout();
    try{renderPanel(S.panel);}catch(e){}
  },220);
}

// ── NUDGE & MOTIVATION ENGINE ──────────────────
// Direct logs = user taps (hourly, events, habits). Indirect = ACT auto-tracking.
// Nudges use both to pull the user back to their #1 priority. Consent given at welcome.
const QUOTES=[
  'Discipline is choosing what you want most over what you want now.',
  'The market rewards patience; life rewards consistency.',
  'Energy is information — log it, learn from it.',
  'Small daily wins compound into unrecognizable change.',
  'Your streak is proof you can trust yourself.',
  'Protect your peak hours like capital.',
  'One focused hour beats four distracted ones.',
  'Come back to the breath. Come back to the task.',
];
const NCFG=DB.get('nudgeCfg',{enabled:true,notifs:false});
function topPriority(){
  const g=S.goals.find(x=>x.level==='Today'&&x.progress<100)||S.goals.find(x=>x.level==='Week'&&x.progress<100)||S.goals.find(x=>x.progress<100);
  if(g)return{txt:g.text,kind:'goal'};
  const t=S.tasks.find(t=>!t.done);
  return t?{txt:t.text,kind:'task'}:null;
}
function lastDirectLogMins(){
  let last=0;
  Object.entries(S.hourlyLog).forEach(([k,v])=>{if(k.startsWith(today())&&v.ts){const t=new Date(v.ts).getTime();if(t>last)last=t;}});
  S.events.forEach(e=>{if(e.ts&&e.ts.startsWith(today())){const t=new Date(e.ts).getTime();if(t>last)last=t;}});
  return last?Math.round((Date.now()-last)/60000):null;
}
function buildNudge(){
  const h=new Date().getHours(),pri=topPriority();
  const gap=lastDirectLogMins();
  const act=ACT.daySummary(today());
  // Rule order: streak risk (evening) → no check-in 2h+ → no focus by late morning → low energy → priority push → daily quote
  if(h>=20){const missed=S.habits.filter(x=>!x.log[today()]).length;
    if(missed>0&&S.habits.length)return{lbl:'Streak Protection',txt:`${missed} habit${missed>1?'s':''} not logged today. 30 seconds now keeps your streaks alive.`,act:'Log habits →',go:'habits'};}
  if(h>=6&&h<22&&(gap===null||gap>120))return{lbl:'Check-in',txt:gap===null?'No log yet today. What are you doing right now, and how is your energy?':`${Math.floor(gap/60)}h since your last check-in. A 10-second log keeps your pattern data honest.`,act:'Quick log →',go:'hourly'};
  if(h>=11&&h<18&&(!act||act.focusMin===0)&&pri)return{lbl:'Deep Work Nudge',txt:`No focus session yet today. Your priority: “${pri.txt}”. One Pomodoro moves it forward.`,act:'Start focus →',go:'focus'};
  if(act&&act.avgE!==null&&act.avgE<4.5)return{lbl:'Energy Care',txt:`Average energy today is ${act.avgE.toFixed(1)}/10. A short walk, water, or 5 minutes of pranayama before pushing harder.`,act:'Burnout check →',go:'burnout'};
  if(pri)return{lbl:'Priority',txt:`“${pri.txt}” — this is your #1 right now. ${QUOTES[new Date().getDate()%QUOTES.length]}`,act:pri.kind==='goal'?'Open goals →':'Open tasks →',go:pri.kind==='goal'?'goals':'tasks'};
  return{lbl:'Today',txt:QUOTES[new Date().getDate()%QUOTES.length],act:'Set a goal →',go:'goals'};
}
function nudgeAction(go){if(go==='focus')openFocus();else goPanelB(go);}
let lastNotifAt=DB.get('lastNotifAt',0);
function nudgeTick(){
  if(!NCFG.enabled)return;
  const n=buildNudge();
  // refresh dashboard card if visible
  const card=document.getElementById('nudge-card');
  if(card)card.innerHTML=`<div class="nc-lbl">◈ ${n.lbl}</div><div class="nc-txt">${escH(n.txt)}</div><div class="nc-act" onclick="nudgeAction('${n.go}')">${n.act}</div>`;
  // system notification at most every 2h, only for action nudges
  if(NCFG.notifs&&'Notification'in window&&Notification.permission==='granted'&&['Check-in','Streak Protection','Deep Work Nudge'].includes(n.lbl)&&Date.now()-lastNotifAt>2*3600*1000&&document.hidden){
    try{new Notification('Life OS · '+n.lbl,{body:n.txt});lastNotifAt=Date.now();DB.set('lastNotifAt',lastNotifAt);}catch(e){}
  }
}
function toggleNotifs(){
  if(!('Notification'in window)){toast('⚠️','Notifications not supported in this browser');return;}
  if(NCFG.notifs){NCFG.notifs=false;DB.set('nudgeCfg',NCFG);toast('🔕','Reminders off');renderSettings();return;}
  Notification.requestPermission().then(p=>{
    NCFG.notifs=(p==='granted');DB.set('nudgeCfg',NCFG);
    toast(p==='granted'?'🔔':'⚠️',p==='granted'?'Reminders on!':'Permission denied — enable in browser settings');
    renderSettings();
  });
}

function goPanel(id){
  if(id!=='feedback')S.lastPanel=id;
  if(document.body.classList.contains('sb-open'))closeSidebarDrawer();
  ACT.switch(id);
  S.panel=id;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  const p=document.getElementById('p-'+id);
  if(p){p.classList.add('on');renderPanel(id);}
  document.querySelectorAll('.ni[data-p]').forEach(n=>n.classList.toggle('on',n.dataset.p===id));
  document.querySelectorAll('.tnb[data-p]').forEach(n=>n.classList.toggle('on',n.dataset.p===id));
  document.querySelectorAll('.bni[data-b]').forEach(n=>n.classList.toggle('on',n.dataset.b===id));
}

// ── LIFE SCORE ENGINE ──────────────────────────
function computeLifeScore(){
  // Habits: completion over the last 7 days
  const week=[...Array(7)].map((_,i)=>dkey(addDays(new Date(),-i)));
  const habitsDone=S.habits.reduce((a,h)=>a+week.filter(d=>h.log[d]).length,0);
  const habitsTotal=S.habits.length*7;
  const hPct=habitsTotal>0?habitsDone/habitsTotal*100:50;
  const tasksDone=S.tasks.filter(t=>t.done).length,tasksTotal=S.tasks.length;
  const tPct=tasksTotal>0?tasksDone/tasksTotal*100:50;
  const eventsToday=S.events.filter(e=>e.ts&&e.ts.startsWith(today())).length;
  const ePct=Math.min(eventsToday/6*100,100);
  const bPct=(100-Math.round((100-S.burnout.energy*.6+S.burnout.stress*.4)));
  const score=Math.round(hPct*.35+tPct*.25+ePct*.2+bPct*.2);
  document.getElementById('lifescore').textContent=score;
  document.getElementById('lifebar').style.width=score+'%';
  document.getElementById('lifesub').textContent=`${Math.round(hPct)}% habits · ${S.focusSessions} focus sessions`;
  document.getElementById('ds-recovery')&&(document.getElementById('ds-recovery').textContent=score+'%');
  return score;
}

// ── EVENT SYSTEM ───────────────────────────────
function logEvent(type,detail,energy=7,focus=7,domain='general'){
  const ev={id:S.nextEventId++,ts:new Date().toISOString().slice(0,16),type,detail,energy,focus,domain};
  S.events.unshift(ev);
  if(S.events.length>200)S.events=S.events.slice(0,200);
  DB.set('events',S.events);DB.set('nextEventId',S.nextEventId);
  ACT.logSample(energy,focus);
  document.getElementById('ss-ev').textContent=S.events.length;
  computeLifeScore();
  return ev;
}
