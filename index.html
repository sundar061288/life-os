function renderHLInsights(){
  const el=document.getElementById('hl-insights');if(!el)return;
  // Aggregate energy by hour across ALL logged days
  const byHour={};
  Object.entries(S.hourlyLog).forEach(([k,v])=>{const h=k.split('|')[1]||k;(byHour[h]=byHour[h]||[]).push(v.energy);});
  const avgs=Object.entries(byHour).map(([h,arr])=>({h,avg:arr.reduce((a,b)=>a+b,0)/arr.length,n:arr.length})).sort((a,b)=>b.avg-a.avg);
  if(avgs.length<2){el.innerHTML='Log a few hours across your day — your personal peak-focus window and energy dips will appear here, computed from your real data.';return;}
  const peak=avgs[0],dip=avgs[avgs.length-1];
  const totalLogs=Object.keys(S.hourlyLog).length;
  el.innerHTML=`
    📈 <strong style="color:var(--t0)">Peak Energy Hour:</strong> ${peak.h}:00 — avg ${peak.avg.toFixed(1)}/10 across ${peak.n} log${peak.n>1?'s':''}. Protect this for deep work / trading.<br>
    ⬇️ <strong style="color:var(--t0)">Lowest Energy Hour:</strong> ${dip.h}:00 — avg ${dip.avg.toFixed(1)}/10. Schedule rest or admin, not decisions.<br>
    🗂 <strong style="color:var(--t0)">Data:</strong> ${totalLogs} hourly logs collected. More logs → sharper pattern.`;
}

    <button class="btn bp" style="margin-top:8px;" onclick="saveDecision()">Save Decision</button>`;

function saveDecision(){
  const d=document.getElementById('dj-decision')?.value.trim();
  if(!d){toast('⚠️','Enter a decision');return;}
  S.decisions.unshift({
    id:S.nextDecisionId++,
    date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'}),
    type:document.getElementById('dj-type')?.value||'life',
    decision:d,
    reason:document.getElementById('dj-reason')?.value||'—',
    expected:document.getElementById('dj-expected')?.value||'—',
    actual:'Pending…',outcome:null
  });
  save();renderDecisions();toast('⚖','Decision logged!');
}
function updateOutcome(id){
  const d=S.decisions.find(x=>x.id===id);if(!d)return;
  const actual=prompt('What actually happened?',d.actual==='Pending…'?'':d.actual);
  if(actual===null)return;
  const oc=prompt('Outcome score 0–100 (how well did this decision work)?',d.outcome??'');
  if(oc===null)return;
  d.actual=actual.trim()||d.actual;
  d.outcome=Math.max(0,Math.min(100,parseInt(oc)||0));
  save();renderDecisions();
  logEvent('review',`Decision outcome logged: ${d.decision.slice(0,50)} → ${d.outcome}%`,6,6,'mind');
  toast('⚖','Outcome recorded!');
}
function deleteDecision(id){if(!confirm('Delete this decision?'))return;S.decisions=S.decisions.filter(x=>x.id!==id);save();renderDecisions();}

  const PR={1:{l:'P1',c:'var(--ros)'},2:{l:'P2',c:'var(--saf)'},3:{l:'P3',c:'var(--t2)'}};
  const open=S.tasks.filter(t=>!t.done).sort((a,b)=>{
    const pd=(a.pri||2)-(b.pri||2); if(pd)return pd;
    if(a.due&&b.due)return a.due.localeCompare(b.due);
    return a.due?-1:b.due?1:0;
  }),done=S.tasks.filter(t=>t.done);
  p.innerHTML=`
    <div class="ph"><div><div class="ph-t">Task Manager</div><div class="ph-s">P1 first · Your top P1 drives the check-in prompts</div></div></div>
    <div class="g2">
      <div>
        <div style="display:flex;gap:7px;margin-bottom:8px;">
          ${micBtn('t-inp')}
          <input type="text" class="ti" id="t-inp" placeholder="Add task… or use 🎤" style="flex:1;margin:0;" onkeydown="if(event.key==='Enter')addTask()">
          <select id="t-pri" style="background:var(--bg3);border:1px solid var(--b2);border-radius:7px;padding:0 8px;color:var(--t1);font-size:11px;"><option value="1">P1 · Must</option><option value="2" selected>P2 · Should</option><option value="3">P3 · Later</option></select>
          <select id="t-cat" style="background:var(--bg3);border:1px solid var(--b2);border-radius:7px;padding:0 8px;color:var(--t1);font-size:11px;">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join('')}</select>

        <div class="card" id="t-open">${renderTaskList(open)}</div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);">Completed (${done.length})</span>
          <span style="font-size:10px;color:var(--ros);cursor:pointer;font-weight:600;" onclick="clearDone()">Clear all</span>
        </div>
        <div class="card" id="t-done">${renderTaskList(done,true)}</div>
      </div>
    </div>`;
  updateTaskStats();
}
function renderTaskList(tasks,isDone=false){
  const PR={1:{l:'P1',c:'var(--ros)'},2:{l:'P2',c:'var(--saf)'},3:{l:'P3',c:'var(--t2)'}};
  if(!tasks.length)return`<div style="padding:20px;text-align:center;color:var(--t2);font-size:11.5px;">${isDone?'Nothing completed yet':'No tasks · Add one above'}</div>`;
  return tasks.map(t=>`<div class="trow">
    <div class="tck ${t.done?'d':''}" onclick="toggleTask(${t.id})">${t.done?'✓':''}</div>
    <span class="ttag" style="background:${PR[t.pri||2].c}22;color:${PR[t.pri||2].c};cursor:pointer;" onclick="cyclePri(${t.id})">${PR[t.pri||2].l}</span>
    ${t.due?`<span class="ttag" style="background:var(--ks);color:var(--sky);">${t.due}${S.reminders.some(r=>r.taskId===t.id&&!r.fired)?' ⏰':''}</span>`:''}
    ${t.recur?`<span class="ttag" style="background:var(--vs);color:var(--vio);">↻</span>`:''}
    <div class="ttx ${t.done?'d':''}">${escH(t.text)}</div>
    <span class="ttag" style="background:${CATS[t.cat]?.c||'var(--ind)'}22;color:${CATS[t.cat]?.c||'var(--ind)'}">${CATS[t.cat]?.l||t.cat}</span>
    <span class="tx" onclick="deleteTask(${t.id})">×</span>
  </div>`).join('');
}
function addTask(){
  const inp=document.getElementById('t-inp'),cat=document.getElementById('t-cat')?.value||'deep';
  if(!inp?.value.trim())return;
  S.tasks.push({id:S.nextTaskId++,text:inp.value.trim(),cat,pri:parseInt(document.getElementById('t-pri')?.value||2),done:false,ts:Date.now()});
  inp.value='';save();renderTasks();toast('✓','Task added');
}
function toggleTask(id){
  const t=S.tasks.find(t=>t.id===id);if(!t)return;
  t.done=!t.done;save();
  if(t.done)logEvent('task',`Completed: ${t.text}`,7,7,t.cat);
  renderTasks();updateTaskStats();
}
function cyclePri(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.pri=((t.pri||2)%3)+1;save();renderTasks();}
function deleteTask(id){S.tasks=S.tasks.filter(t=>t.id!==id);save();renderTasks();updateTaskStats();}
function clearDone(){S.tasks=S.tasks.filter(t=>!t.done);save();renderTasks();updateTaskStats();}
function updateTaskStats(){
  const done=S.tasks.filter(t=>t.done).length;
  document.getElementById('ss-td').textContent=`${done}/${S.tasks.length}`;
  computeLifeScore();
}

function bumpGoal(id,by){

function habitStreak(h){
  let st=0,d=new Date();
  if(!h.log[dkey(d)])d=addDays(d,-1); // streak survives if today not yet logged
  while(h.log[dkey(d)]){st++;d=addDays(d,-1);}
  return st;
}

  const fill=document.getElementById('gfill');
  const offset=180-(risk/100*180);
  if(fill)fill.setAttribute('stroke-dashoffset',offset);
  const num=document.getElementById('bnum'),lbl=document.getElementById('blbl'),adv=document.getElementById('badv');
  if(num)num.textContent=risk+'%';
  const c=risk<30?'var(--em)':risk<55?'var(--saf)':'var(--ros)';
  if(num)num.style.color=c;
  if(lbl)lbl.textContent=risk<30?'Low Risk · Excellent':risk<55?'Moderate · Monitor':'High Risk · Act Now';

function renderAudit(){
  const p=document.getElementById('p-audit');
  const CAT_COLOR={'Deep Work':'var(--ind)','Planning':'var(--sky)','Execution':'var(--em)','Discipline':'var(--em)','Logging':'var(--saf)','Reflection':'var(--vio)','AI Coaching':'var(--vio)','Analytics':'var(--cor)','Wellness':'var(--pin)','Overview':'var(--t2)','System':'var(--t3)'};
  // Today: where attention went inside the OS
  const tp=ACT.todayPanelSecs();
  const byCat={};let totSecs=0;
  Object.entries(tp).forEach(([panel,secs])=>{const c=PANEL_CAT[panel]||'Other';byCat[c]=(byCat[c]||0)+secs;totSecs+=secs;});
  const act=ACT.daySummary(today());
  const rows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  // 7-day trend
  const days=[...Array(7)].map((_,i)=>{const d=addDays(new Date(),-(6-i));const sum=ACT.daySummary(dkey(d));return{d,min:sum?Math.round(sum.total/60):0,fm:sum?sum.focusMin:0,e:sum&&sum.avgE?sum.avgE:null};});

function saveJournal(){
  const w=document.getElementById('jw')?.value.trim(),d=document.getElementById('jd')?.value.trim();
  if(!w&&!d){toast('⚠️','Write something first');return;}
  const entry={dk:today(),date:new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}),wins:w,drain:d,tomorrow:document.getElementById('jt')?.value.trim(),insight:document.getElementById('jm')?.value.trim()};
  S.journalEntries.unshift(entry);save();

  closeJournalPrompt();
  toast('✍️','Journal entry saved!');renderJournal();
}
function deleteJournal(i){if(!confirm('Delete this journal entry?'))return;S.journalEntries.splice(i,1);save();renderJournal();}

      if(!d.tasks&&!d.events){toast('⚠️','Not a Life OS backup file');return;}
      if(d.rewards)Object.assign(RW,d.rewards),saveRW();
      if(d.ftasks)FTASKS=d.ftasks,saveFTasks();
      if(d.hourCfg)Object.assign(HRCFG,d.hourCfg),DB.set('hourCfg',HRCFG);
      if(d.journalCfg)Object.assign(JRCFG,d.journalCfg),DB.set('journalCfg',JRCFG);
      if(d.recurring)S.recurring=d.recurring,DB.set('recurring',S.recurring);
      if(d.briefCfg)Object.assign(BRF,d.briefCfg),DB.set('briefCfg',BRF);
      if(d.feedback)DB.set('feedback',d.feedback);
      if(d.expenses)S.expenses=d.expenses,DB.set('expenses',S.expenses);
      if(d.theme)applyTheme(d.theme);
      if(d.sleep)S.sleep=Object.assign(S.sleep||{},d.sleep);
      if(d.screenTime)S.screenTime=Object.assign(S.screenTime,d.screenTime);
      ['tasks','habits','goals','events','aiMemory','decisions','journalEntries','hourlyLog','weekPlans','weekReviews','burnout'].forEach(k=>{if(d[k]!==undefined)S[k]=k==='habits'?migrateHabits(d[k]):k==='hourlyLog'?migrateHourly(d[k]):d[k];});
      if(d.profile)Object.assign(PROFILE,d.profile),DB.set('profile',PROFILE);
      if(d.activity)ACT.data=Object.assign(ACT.data,d.activity),DB.set('activity',ACT.data);
      if(typeof d.focusSessions==='number')S.focusSessions=d.focusSessions;
      save();DB.set('mode','fresh');
      toast('📤','Data imported!');setTimeout(()=>location.reload(),800);
    }catch(e){toast('⚠️','Import failed — invalid file');}
  };

}

function fillFSel(current){
  const sel=document.getElementById('fsel');if(!sel)return;
  const list=(current&&!FTASKS.includes(current))?[current].concat(FTASKS):FTASKS;
  sel.innerHTML=list.map(t=>`<option${t===current?' selected':''}>${escH(t)}</option>`).join('')
    +'<option value="__add">＋ Add new activity…</option>'
    +(FTASKS.length?'<option value="__manage">✎ Rename / delete…</option>':'');
}
function addFTask(){
  const n=prompt('Name your focus activity:');
  const cur=document.getElementById('ftask').textContent;
  if(n&&n.trim()){FTASKS.push(n.trim());saveFTasks();fillFSel(n.trim());
    document.getElementById('ftask').textContent=n.trim();toast('＋','Activity added');}
  else fillFSel(cur);
}
function manageFTasks(){
  const cur=document.getElementById('ftask').textContent;
  const idx=prompt('Which activity? Enter its number:\n\n'+FTASKS.map((t,i)=>`${i+1}. ${t}`).join('\n'));
  const i=parseInt(idx)-1;
  if(isNaN(i)||i<0||i>=FTASKS.length){fillFSel(cur);return;}
  const action=prompt(`"${FTASKS[i]}"\n\nType a NEW NAME to rename it, or type DELETE to remove it:`,FTASKS[i]);
  if(action===null){fillFSel(cur);return;}
  if(action.trim().toUpperCase()==='DELETE'){
    const removed=FTASKS.splice(i,1)[0];saveFTasks();toast('🗑',`"${removed}" removed`);
  }else if(action.trim()){FTASKS[i]=action.trim();saveFTasks();toast('✎','Renamed');}
  const next=FTASKS[0]||'Deep Focus Session';
  fillFSel(next);document.getElementById('ftask').textContent=next;
}

function startFocus(){
  const dur=FCFG.work;
  if(!S.focusRunning&&(S.focusSecs<=0||S.focusSecs>dur*60))S.focusSecs=dur*60;
  S.focusRunning=true;document.getElementById('ftog').textContent='⏸ Pause';
  S.focusInt=setInterval(()=>{
    S.deepWorkSecs++;
    const h=Math.floor(S.deepWorkSecs/3600),m=Math.floor((S.deepWorkSecs%3600)/60);
    document.getElementById('ss-dw').textContent=`${h}h ${m}m`;
    S.focusSecs--;updateFocusRing();
    if(S.focusSecs<=0){
      clearInterval(S.focusInt);S.focusRunning=false;S.focusSessions++;
      document.getElementById('fscount').textContent=S.focusSessions;
      document.getElementById('ss-fs').textContent=S.focusSessions;

function pauseFocus(){clearInterval(S.focusInt);S.focusRunning=false;document.getElementById('ftog').textContent='▶ Resume';}
function resetFocus(){

function updateFocusRing(){
  const dur=FCFG.work*60;
  const prog=1-(S.focusSecs/dur);const circ=2*Math.PI*48;
  const ring=document.getElementById('fring');
  if(ring){ring.setAttribute('stroke-dasharray',circ);ring.setAttribute('stroke-dashoffset',circ*(1-prog));}
  const m=String(Math.floor(S.focusSecs/60)).padStart(2,'0'),s=String(S.focusSecs%60).padStart(2,'0');
  const t=document.getElementById('ftnum');if(t)t.textContent=m+':'+s;
  const meta=document.getElementById('fmeta');if(meta)meta.textContent=`${Math.ceil(S.focusSecs/60)} min remaining · Session ${S.focusSessions+1}`;
}

  if(FRESH===null&&!localStorage.getItem('los_tasks'))setTimeout(showOnboarding,150);
  if(location.protocol!=='file:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  setTimeout(()=>toast('🚀','Life OS ready, '+PROFILE.name+'!'),700);
}
init();
</script>
