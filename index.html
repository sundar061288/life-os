<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life OS">
<meta name="theme-color" content="#0a0d17">
<title>Life OS — Personal Intelligence System</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=DM+Serif+Display:ital@0;1&display=swap');

/* ══════════════════════════════════════════
   LIFE OS v3 — DESIGN SYSTEM
   Signature: Obsidian black + Indigo pulse
   + Saffron gold life-line + Event timeline
══════════════════════════════════════════ */
:root {
  --bg0:#080b14; --bg1:#0e1220; --bg2:#141928; --bg3:#1a2035;
  --bg4:#212840; --bg5:#2a3350; --rim:#334;
  --ind:#6366f1; --vio:#8b5cf6; --saf:#f59e0b;
  --em:#10b981; --sky:#38bdf8; --ros:#f43f5e;
  --cor:#fb923c; --pin:#ec4899;
  --is:rgba(99,102,241,.15); --vs:rgba(139,92,246,.13);
  --ss:rgba(245,158,11,.13); --es:rgba(16,185,129,.12);
  --ks:rgba(56,189,248,.11); --rs:rgba(244,63,94,.12);
  --t0:#f0f3ff; --t1:#9ba5c2; --t2:#4e5878; --t3:#2c3452;
  --b1:rgba(255,255,255,.055); --b2:rgba(255,255,255,.1); --b3:rgba(255,255,255,.17);
  --r:10px; --rl:14px; --trans:160ms ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:var(--bg0);color:var(--t0);display:flex;flex-direction:column;font-size:13px}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}
textarea,input[type=text],input[type=number]{user-select:text}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:4px}


@keyframes starpop{0%{transform:scale(.3) rotate(-25deg);opacity:0}60%{transform:scale(1.25) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
/* ══ MOBILE-FIRST MINIMALIST LAYER (v5) ══ */
#bnav{display:none}
#moresheet{display:none}
.nudgecard{background:linear-gradient(135deg,rgba(99,102,241,.14),rgba(245,158,11,.08));border:1px solid rgba(99,102,241,.25);border-radius:var(--rl);padding:14px 16px;margin-bottom:14px}
.nc-lbl{font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--saf);margin-bottom:5px}
.nc-txt{font-size:12.5px;color:var(--t0);line-height:1.6}
.nc-act{margin-top:8px;font-size:11px;font-weight:700;color:var(--ind);cursor:pointer}
.qrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.qbtn{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rl);padding:13px 4px;text-align:center;cursor:pointer;transition:var(--trans)}
.qbtn:active{background:var(--bg3);transform:scale(.96)}
.qbi{font-size:19px;margin-bottom:4px}
.qbl{font-size:9px;font-weight:600;color:var(--t1)}


/* ── TOPBAR ── */
#top{height:calc(48px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:var(--bg1);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));gap:10px;flex-shrink:0;z-index:100}
#sbtog{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--bg3);border:1px solid var(--b1);color:var(--t1);font-size:15px;cursor:pointer;transition:var(--trans)}
#sbtog:hover{background:var(--bg4);color:var(--t0)}
#sbtog:active{transform:scale(.92)}
body.sb-off #sb{display:none}
#sbdrop{display:none;position:fixed;inset:0;background:rgba(8,11,20,.6);backdrop-filter:blur(3px);z-index:340}
#sbdrop.on{display:block}
.logo{width:30px;height:30px;background:linear-gradient(135deg,var(--ind),var(--vio));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 0 18px rgba(99,102,241,.4)}
.brand{font-size:13px;font-weight:700;letter-spacing:.03em}
.ver{font-size:9px;color:var(--t3);background:var(--bg3);padding:2px 6px;border-radius:4px;border:1px solid var(--b1);font-family:'JetBrains Mono',monospace}
.sp{flex:1}
.tnav{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tnav::-webkit-scrollbar{display:none}
.tnb{flex-shrink:0}
.tnb{padding:4px 11px;border-radius:6px;font-size:11px;font-weight:500;background:transparent;color:var(--t2);transition:var(--trans)}
.tnb:hover{background:var(--bg3);color:var(--t1)}
.tnb.on{background:var(--is);color:var(--ind)}
.tright{display:flex;align-items:center;gap:8px}
#clk{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t1);background:var(--bg3);padding:3px 9px;border-radius:5px;border:1px solid var(--b1)}
.ebadge{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;background:var(--es);border:1px solid rgba(16,185,129,.25);font-size:10px;font-weight:600;color:var(--em);cursor:pointer;transition:var(--trans)}
.epulse{width:6px;height:6px;border-radius:50%;background:var(--em);animation:ep 2s infinite}
@keyframes ep{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}50%{box-shadow:0 0 0 4px rgba(16,185,129,0)}}
.lifeline{height:2px;background:linear-gradient(90deg,var(--ind),var(--vio),var(--saf),var(--em),var(--ind));background-size:300%;animation:ll 5s linear infinite;flex-shrink:0}
@keyframes ll{0%{background-position:0%}100%{background-position:300%}}

/* ── SHELL ── */
#shell{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
#sb{width:220px;background:var(--bg1);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.score-w{margin:12px 10px 6px;background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(139,92,246,.05));border:1px solid rgba(99,102,241,.2);border-radius:var(--r);padding:14px}
.sw-lbl{font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);margin-bottom:6px}
.sw-row{display:flex;align-items:baseline;gap:3px}
.sw-big{font-family:'DM Serif Display',serif;font-size:40px;color:var(--ind);line-height:1}
.sw-dom{font-size:9px;color:var(--t2)}
.sw-bar-bg{margin-top:7px;background:var(--bg4);border-radius:3px;height:4px;overflow:hidden}
.sw-bar{height:4px;border-radius:3px;background:linear-gradient(90deg,var(--ind),var(--vio));transition:width .6s ease}
.sw-sub{font-size:9px;color:var(--t2);margin-top:5px}
.ng{padding:10px 8px 4px}
.ngl{font-size:8px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--t3);padding:0 6px;margin-bottom:3px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;font-size:11.5px;font-weight:500;color:var(--t1);cursor:pointer;transition:var(--trans);margin-bottom:1px;position:relative}
.ni:hover{background:var(--bg3);color:var(--t0)}
.ni.on{background:var(--is);color:var(--ind)}
.ni.on::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:0 3px 3px 0;background:var(--ind)}
.nic{font-size:13px;width:16px;text-align:center;flex-shrink:0}
.nbadge{margin-left:auto;font-size:8px;font-weight:800;padding:1px 5px;border-radius:10px;background:var(--ind);color:#fff}
.nbadge.g{background:var(--em)} .nbadge.s{background:var(--saf);color:#000}
.sdiv{height:1px;background:var(--b1);margin:5px 10px}
.sb-stats{padding:6px 14px 14px;display:flex;flex-direction:column;gap:6px}
.ssr{display:flex;justify-content:space-between;align-items:center}
.ssn{font-size:10px;color:var(--t2)}
.ssv{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600}

/* ── MAIN ── */
#main{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg0);padding:22px 26px;padding-left:max(26px,env(safe-area-inset-left));padding-right:max(26px,env(safe-area-inset-right));-webkit-overflow-scrolling:touch}
.panel{display:none}.panel.on{display:block;animation:pin .16s ease}
@keyframes pin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.ph-t{font-family:'DM Serif Display',serif;font-size:22px;color:var(--t0)}
.ph-s{font-size:10.5px;color:var(--t2);margin-top:2px}
.ph-a{display:flex;gap:7px;flex-shrink:0}
.btn{padding:6px 14px;border-radius:7px;font-size:11px;font-weight:600;transition:var(--trans);display:inline-flex;align-items:center;gap:5px}
.bp{background:var(--ind);color:#fff}.bp:hover{background:#7577f3;box-shadow:0 0 14px rgba(99,102,241,.35)}
.bg{background:var(--bg3);color:var(--t1);border:1px solid var(--b2)}.bg:hover{background:var(--bg4);color:var(--t0)}
.bd{background:var(--rs);color:var(--ros);border:1px solid rgba(244,63,94,.2)}.bd:hover{background:rgba(244,63,94,.18)}
.bsm{padding:4px 10px;font-size:10.5px;border-radius:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.card{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);padding:16px}
.card:hover{border-color:var(--b2)}
.chd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ct{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--t1)}
.ca{font-size:10px;color:var(--ind);cursor:pointer;font-weight:600}
.ca:hover{text-decoration:underline}
.sc{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);padding:14px 16px;transition:var(--trans)}
.sc:hover{transform:translateY(-1px);border-color:var(--b2)}
.sl{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t2)}
.sv{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;margin:5px 0 2px;line-height:1}
.sd{font-size:10px}
.up{color:var(--em)}.dn{color:var(--ros)}
.sdiv2{display:flex;align-items:center;gap:8px;margin:18px 0 14px}
.sdiv2-l{flex:1;height:1px;background:var(--b1)}
.sdiv2-t{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);white-space:nowrap}
input[type=range]{width:100%;height:4px;border-radius:4px;-webkit-appearance:none;appearance:none;background:var(--bg4);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ind);border:2px solid var(--bg2);box-shadow:0 0 6px rgba(99,102,241,.5)}
.tog{position:relative;width:36px;height:20px;background:var(--bg4);border-radius:10px;cursor:pointer;transition:var(--trans);flex-shrink:0}
.tog.on{background:var(--ind)}
.tog::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:var(--trans);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog.on::after{left:19px}
.pr{margin-bottom:11px}
.pr-hd{display:flex;justify-content:space-between;margin-bottom:3px}
.pr-n{font-size:11px;color:var(--t1);font-weight:500}
.pr-p{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t2)}
.pr-bg{background:var(--bg4);border-radius:3px;height:5px;overflow:hidden}
.pr-f{height:5px;border-radius:3px;transition:width .7s cubic-bezier(.4,0,.2,1)}

/* ── TOAST ── */
#ta{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column-reverse;gap:7px;z-index:999}
.toast{background:var(--bg4);border:1px solid var(--b2);border-radius:7px;padding:9px 14px;font-size:12px;color:var(--t0);box-shadow:0 4px 20px rgba(0,0,0,.5);animation:tin .18s ease;display:flex;align-items:center;gap:7px;max-width:280px}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* ── FOCUS MODAL ── */
#fov{position:fixed;inset:0;background:rgba(8,11,20,.92);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;z-index:998}
#fov.on{display:flex;animation:foin .2s ease}
@keyframes foin{from{opacity:0}to{opacity:1}}
.fbox{background:var(--bg2);border:1px solid var(--b2);border-radius:var(--rl);width:400px;padding:32px;text-align:center;box-shadow:0 0 80px rgba(99,102,241,.18)}
.flbl{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ind);margin-bottom:6px}
.ftask{font-size:16px;font-weight:700;color:var(--t0);margin:4px 0 20px;font-family:'DM Serif Display',serif}
.fring{position:relative;width:110px;height:110px;margin:0 auto 14px}
.fring svg{width:110px;height:110px;transform:rotate(-90deg)}
.frb{fill:none;stroke:var(--bg4);stroke-width:7}
.frf{fill:none;stroke:var(--ind);stroke-width:7;stroke-linecap:round;stroke-dasharray:314;transition:stroke-dashoffset 1s linear}
.ftnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:var(--ind)}
.fmeta{font-size:10px;color:var(--t2);margin-bottom:20px}
.fbtns{display:flex;gap:7px;justify-content:center}
.fsel{margin-bottom:14px;background:var(--bg3);border:1px solid var(--b2);border-radius:7px;padding:7px 10px;color:var(--t1);font-size:11px;width:100%}

/* ── EVENT TIMELINE ── */
.ev-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--b1);align-items:flex-start}
.ev-item:last-child{border-bottom:none}
.ev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.ev-time{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--t2);width:40px;flex-shrink:0;padding-top:1px}
.ev-body{flex:1}
.ev-type{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ev-detail{font-size:11px;color:var(--t1);margin-top:1px}
.ev-meta{font-size:9px;color:var(--t2);margin-top:2px;display:flex;gap:8px}
.ev-tag{font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:10px}

/* ── HOURLY LOGGER ── */
.hl-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.hl-cell{background:var(--bg3);border-radius:6px;padding:8px 6px;text-align:center;cursor:pointer;border:1px solid transparent;transition:var(--trans)}
.hl-cell:hover{border-color:var(--b2);background:var(--bg4)}
.hl-cell.logged{border-color:rgba(99,102,241,.3);background:var(--is)}
.hl-hour{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--t2);margin-bottom:3px}
.hl-energy{font-size:14px;line-height:1}
.hl-mood{font-size:9px;color:var(--t1);margin-top:2px}

/* ── DECISION JOURNAL ── */
.dj-item{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.dj-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dj-type{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:10px}
.dj-date{font-size:9.5px;color:var(--t2);font-family:'JetBrains Mono',monospace;margin-left:auto}
.dj-decision{font-size:12px;font-weight:600;color:var(--t0);margin-bottom:6px}
.dj-row{display:flex;gap:16px;font-size:10.5px;color:var(--t1)}
.dj-field{display:flex;gap:4px}
.dj-lbl{color:var(--t2);font-weight:600}
.dj-val{color:var(--t0)}
.dj-outcome{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--b1)}
.outcome-bar{flex:1;background:var(--bg4);border-radius:3px;height:4px;overflow:hidden}
.outcome-fill{height:4px;border-radius:3px}

/* ── KNOWLEDGE GRAPH ── */
.kg-node{text-align:center;cursor:pointer}
.kg-circle{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:10px;font-weight:700;transition:var(--trans)}
.kg-circle:hover{transform:scale(1.1)}
.kg-label{font-size:9px;color:var(--t1);font-weight:500}
.kg-arrow{display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:14px;padding:2px 0}

/* ── LIFE DOMAINS RING ── */
.domain-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.domain-card{background:var(--bg3);border:1px solid var(--b1);border-radius:8px;padding:10px;text-align:center;cursor:pointer;transition:var(--trans)}
.domain-card:hover{border-color:var(--b2);transform:translateY(-1px)}
.domain-icon{font-size:18px;margin-bottom:4px}
.domain-name{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t1)}
.domain-score{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;margin-top:2px}
.domain-bar{margin-top:6px;background:var(--bg4);border-radius:3px;height:3px;overflow:hidden}
.domain-fill{height:3px;border-radius:3px}

/* ── AI MEMORY ── */
.mem-item{background:var(--bg3);border:1px solid var(--b1);border-radius:7px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
.mem-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.mem-text{font-size:11.5px;color:var(--t0);line-height:1.5;flex:1}
.mem-date{font-size:9px;color:var(--t2);font-family:'JetBrains Mono',monospace;margin-top:3px}
.mem-del{color:var(--t3);cursor:pointer;font-size:14px;flex-shrink:0}
.mem-del:hover{color:var(--ros)}

/* ── AI CHAT ── */
.ai-shell{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rl);overflow:hidden;display:flex;flex-direction:column;height:calc(100dvh - 190px);min-height:320px}
.aiqb{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px;border-bottom:1px solid var(--b1);background:var(--bg3)}
.qc{padding:4px 11px;border-radius:18px;font-size:10.5px;font-weight:500;background:var(--bg2);color:var(--t1);border:1px solid var(--b2);cursor:pointer;transition:var(--trans)}
.qc:hover{background:var(--is);color:var(--ind);border-color:rgba(99,102,241,.3)}
.aimsg{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;max-width:88%}
.msg.u{margin-left:auto;flex-direction:row-reverse}
.mav{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.mav.b{background:linear-gradient(135deg,var(--ind),var(--vio))}
.mav.u{background:var(--bg4);border:1px solid var(--b2)}
.mb{padding:10px 13px;font-size:12.5px;line-height:1.6;border-radius:10px}
.msg.b .mb{background:var(--bg3);border:1px solid var(--b1);color:var(--t0);border-radius:3px 10px 10px 10px}
.msg.u .mb{background:var(--is);border:1px solid rgba(99,102,241,.22);color:var(--t0);border-radius:10px 3px 10px 10px}
.thk{display:flex;gap:4px;align-items:center;padding:10px 13px;background:var(--bg3);border:1px solid var(--b1);border-radius:3px 10px 10px 10px;width:fit-content}
.td{width:5px;height:5px;border-radius:50%;background:var(--ind);animation:tdb 1.2s ease-in-out infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tdb{0%,80%,100%{opacity:.2}40%{opacity:1}}
.aibar{display:flex;gap:7px;padding:10px 14px;background:var(--bg3);border-top:1px solid var(--b1)}

/* ── TASK UI ── */
.ti{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:7px;padding:8px 12px;color:var(--t0);font-size:12.5px;margin-bottom:8px}
.ti:focus{border-color:var(--ind)}
.trow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.trow:last-child{border-bottom:none}
.tck{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--bg5);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:var(--trans)}
.tck.d{background:var(--em);border-color:var(--em);color:#000}
.ttx{flex:1;font-size:12px;color:var(--t0)}

/* ── HABIT UI ── */

.hdays{display:flex;gap:3px}

.hdon{background:var(--em);color:#000}
.hmis{background:var(--bg4);color:var(--t3)}

.tbct{border-color:var(--saf);background:var(--ss)}

.tbca{border-color:var(--sky);background:var(--ks)}

/* ── WEEK GRID ── */

.wdp:hover{background:var(--bg5);color:var(--t0)}

/* ── GOAL TREE ── */
.gtree{position:relative;padding-left:16px}
.gtree::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:1px;background:var(--b2)}

   desktop layout (sidebar + top tabs) to appear on rotation. */
@media (max-width:1024px), (orientation:landscape) and (max-height:600px){

  .ph{flex-direction:column;gap:10px}

  .btn{padding:9px 15px;font-size:12px}

  .hdays{gap:4px}
  .ni,.tnb{padding:10px}
  .hl-cell{padding:10px 4px}
  input[type=range]{height:28px}
  #clk{display:none}
  /* Sidebar becomes a slide-in drawer, opened by the ☰ button */
  body.sb-open #sb{display:flex!important;position:fixed;top:0;left:0;bottom:0;width:min(272px,80vw);z-index:350;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 0 40px rgba(0,0,0,.6);animation:sbin .22s ease}
  @keyframes sbin{from{transform:translateX(-100%)}to{transform:translateX(0)}}
  #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(62px + env(safe-area-inset-bottom));
    background:rgba(14,18,32,.97);backdrop-filter:blur(14px);border-top:1px solid var(--b2);z-index:300;
    padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--t2);transition:var(--trans)}
  .bni.on{color:var(--ind)}
  .bni:active{background:var(--bg3)}
  .bni-ic{font-size:19px;line-height:1}
  .bni-lb{font-size:8.5px;font-weight:700;letter-spacing:.02em}
  #moresheet.on{display:flex;position:fixed;inset:0;background:rgba(8,11,20,.85);backdrop-filter:blur(8px);z-index:400;align-items:flex-end}
  .msheet{background:var(--bg1);border-radius:18px 18px 0 0;border-top:1px solid var(--b2);width:100%;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:78vh;max-height:78dvh;overflow-y:auto}
  .ms-hd{width:36px;height:4px;background:var(--bg5);border-radius:2px;margin:0 auto 16px}
  .ms-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ms-it{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rl);padding:15px 6px;text-align:center;cursor:pointer}
  .ms-it:active{background:var(--bg3)}
  .ms-ic{font-size:20px;margin-bottom:5px}
  .ms-lb{font-size:9.5px;font-weight:600;color:var(--t1)}
}
/* Narrow phones */
@media (max-width:400px){
  .g4{grid-template-columns:1fr 1fr}
  .qrow{grid-template-columns:repeat(4,1fr);gap:6px}

/* Landscape phone: shorter chrome so content still fits */
@media (orientation:landscape) and (max-height:520px){

}
/* Tablet / desktop: two-column grids stay, sidebar can be toggled off */
@media (min-width:1025px) and (max-width:1320px){
  #sb{width:196px}
  .g3{grid-template-columns:repeat(2,1fr)}
}

/* ── SIDEBAR COLLAPSE (all sizes) ── */
#sb{transition:width .22s ease, transform .22s ease}
body.sb-off #sb{display:none!important}
#sbclose{display:none}
@media (max-width:1024px), (orientation:landscape) and (max-height:600px){

    font-size:11.5px;font-weight:600;cursor:pointer}
  #sbclose:active{background:var(--bg4)}
}

<script>
/* ═══════════════════════════════════════════════
   LIFE OS v4 — COMPLETE INTELLIGENCE RUNTIME\n   + Activity Tracking Engine (time · focus · energy)
   Layers: Event Store + Metrics + Memory + AI
═══════════════════════════════════════════════ */

// ── PERSISTENCE ENGINE (localStorage) ──────────
const DB = {
  get(k,def=null){try{const v=localStorage.getItem('los_'+k);return v?JSON.parse(v):def}catch{return def}},
  set(k,v){try{localStorage.setItem('los_'+k,JSON.stringify(v))}catch(e){console.warn('DB full',e)}},
  del(k){localStorage.removeItem('los_'+k)}
};

// ── DATE HELPERS ───────────────────────────────
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dkey();
const mondayOf=(d=new Date())=>{const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtD=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const escH=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

// ── ACTIVITY TRACKING ENGINE ───────────────────
// Tracks WHERE attention goes (panel/module time), WHAT you do (hourly+events),
// and the FOCUS/ENERGY behind it — all local-first, exportable.
const PANEL_CAT={screentime:'Wellness',rewards:'Discipline',dashboard:'Overview',planner:'Planning',tasks:'Execution',goals:'Planning',habits:'Discipline',events:'Logging',hourly:'Logging',decisions:'Reflection',ai:'AI Coaching',memory:'AI Coaching',domains:'Analytics',knowledge:'Analytics',weekly:'Planning',burnout:'Wellness',audit:'Analytics',journal:'Reflection',procrastination:'Wellness',settings:'System',focus:'Deep Work'};
const ACT={
  data:DB.get('activity',{}),
  cur:'dashboard',curStart:Date.now(),
  ensure(k){if(!this.data[k])this.data[k]={panels:{},focusMin:0,sessions:1,energySum:0,energyN:0,focusSum:0,focusN:0,firstSeen:Date.now(),lastSeen:Date.now()};return this.data[k]},
  flush(){
    const now=Date.now(),secs=Math.round((now-this.curStart)/1000);
    if(secs>0&&secs<3600*3){const d=this.ensure(today());d.panels[this.cur]=(d.panels[this.cur]||0)+secs;d.lastSeen=now;}
    this.curStart=now;DB.set('activity',this.data);
  },
  switch(panel){this.flush();this.cur=panel;},
  logSample(energy,focus){const d=this.ensure(today());if(energy){d.energySum+=energy;d.energyN++;}if(focus){d.focusSum+=focus;d.focusN++;}DB.set('activity',this.data);},
  logFocusMin(min){const d=this.ensure(today());d.focusMin+=min;DB.set('activity',this.data);},
  todayPanelSecs(){this.flush();const d=this.data[today()];return d?d.panels:{}},
  daySummary(k){const d=this.data[k];if(!d)return null;const tot=Object.values(d.panels).reduce((a,b)=>a+b,0);return{total:tot,focusMin:d.focusMin,avgE:d.energyN?d.energySum/d.energyN:null,avgF:d.focusN?d.focusSum/d.focusN:null,panels:d.panels}},
  init(){
    document.addEventListener('visibilitychange',()=>{if(document.hidden)this.flush();else this.curStart=Date.now();});
    window.addEventListener('beforeunload',()=>this.flush());
    setInterval(()=>this.flush(),20000);
    const d=this.ensure(today());d.sessions=(d.sessions||0)+1;DB.set('activity',this.data);
  }
};

// ── PROFILE & CONFIG (persisted) ───────────────
const PROFILE=DB.get('profile',{name:'Sundar',location:'Chennai',wake:'05:00',sleep:'22:30'});
const FCFG=DB.get('focusCfg',{work:25,brk:5});
const FRESH=DB.get('mode',null); // null=first run · 'fresh' · 'sample'

// ── GLOBAL STATE ───────────────────────────────
// Sample data — loaded ONLY if user chooses "Load Sample Data" on first run
const SAMPLE={
  tasks:[
    {id:1,text:'Review Nifty 50 setups — HTF/MTF/LTF',cat:'trade',done:false,ts:Date.now()},
    {id:2,text:'Morning sadhana + pranayama',cat:'body',done:false,ts:Date.now()},

// Migrate old-format habits (days[7] arrays) → date-anchored logs
function migrateHabits(hs){
  if(!Array.isArray(hs))return[];
  return hs.map(h=>{
    if(h.log)return h;
    const log={},mon=mondayOf();
    (h.days||[]).forEach((v,i)=>{if(v===true)log[dkey(addDays(mon,i))]=true;});
    return{name:h.name,cat:h.cat,log};
  });
}
// Migrate old hourly logs (keyed by hour) → keyed by date|hour
function migrateHourly(hl){
  const out={};
  Object.entries(hl||{}).forEach(([k,v])=>{
    if(k.includes('|'))out[k]=v;
    else out[(v.ts?v.ts.slice(0,10):today())+'|'+k]=v;
  });
  return out;
}

// ── STORAGE MANAGEMENT ─────────────────────────
const LS_LIMIT=5*1024*1024; // conservative browser floor (~5MB)
function storageBytes(){
  let t=0;
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('los_'))t+=(k.length+(localStorage.getItem(k)||'').length)*2;}
  return t;
}
function storagePct(){return Math.min(100,Math.round(storageBytes()/LS_LIMIT*100));}
function fmtBytes(b){return b>1024*1024?(b/1024/1024).toFixed(2)+' MB':(b/1024).toFixed(0)+' KB';}
function daysOfData(){
  const keys=new Set();
  Object.keys(S.hourlyLog).forEach(k=>keys.add(k.split('|')[0]));
  Object.keys(S.screenTime).forEach(k=>keys.add(k));
  Object.keys(ACT.data).forEach(k=>keys.add(k));
  return keys.size;
}
// Trim data older than N days (events, hourly logs, completed tasks) — daily records
// like screen time, habits and activity summaries are tiny and always kept.
function archiveOlderThan(days){
  const cutoff=dkey(addDays(new Date(),-days));
  const cutMs=addDays(new Date(),-days).getTime();
  const before=storageBytes();
  S.events=S.events.filter(e=>!e.ts||e.ts.slice(0,10)>=cutoff);
  Object.keys(S.hourlyLog).forEach(k=>{if(k.split('|')[0]<cutoff)delete S.hourlyLog[k];});
  S.tasks=S.tasks.filter(t=>!t.done||!t.ts||t.ts>=cutMs);
  S.journalEntries=S.journalEntries.slice(0,180);
  save();
  const freed=before-storageBytes();
  toast('🗜',`Freed ${fmtBytes(freed)} · ${daysOfData()} days of summaries kept`);
  renderSettings();
}
function checkStorage(){
  const pct=storagePct();
  const lastWarn=DB.get('lastStorageWarn',0);
  if(pct>=75&&Date.now()-lastWarn>24*3600*1000){
    DB.set('lastStorageWarn',Date.now());
    toast('⚠️',`Storage ${pct}% full — export a backup, then archive old logs in Settings`);
  }
}

function answerCheckin(ans){
  const t=topPriorityTask();
  closeCheckin();

    if(ans==='done'&&t){t.done=true;save();logEvent('task',`Completed: ${t.text}`,8,8,t.cat);}

// Direct logs = user taps (hourly, events, habits). Indirect = ACT auto-tracking.
// Nudges use both to pull the user back to their #1 priority. Consent given at welcome.
const QUOTES=[
  'Discipline is choosing what you want most over what you want now.',
  'The market rewards patience; life rewards consistency.',
  'Energy is information — log it, learn from it.',
  'Small daily wins compound into unrecognizable change.',
  'Your streak is proof you can trust yourself.',
  'Protect your peak hours like capital.',
  'One focused hour beats four distracted ones.',
  'Come back to the breath. Come back to the task.',
];
const NCFG=DB.get('nudgeCfg',{enabled:true,notifs:false});
function topPriority(){
  const g=S.goals.find(x=>x.level==='Today'&&x.progress<100)||S.goals.find(x=>x.level==='Week'&&x.progress<100)||S.goals.find(x=>x.progress<100);
  if(g)return{txt:g.text,kind:'goal'};
  const t=S.tasks.find(t=>!t.done);
  return t?{txt:t.text,kind:'task'}:null;
}
function lastDirectLogMins(){
  let last=0;
  Object.entries(S.hourlyLog).forEach(([k,v])=>{if(k.startsWith(today())&&v.ts){const t=new Date(v.ts).getTime();if(t>last)last=t;}});
  S.events.forEach(e=>{if(e.ts&&e.ts.startsWith(today())){const t=new Date(e.ts).getTime();if(t>last)last=t;}});
  return last?Math.round((Date.now()-last)/60000):null;
}
function buildNudge(){
  const h=new Date().getHours(),pri=topPriority();
  const gap=lastDirectLogMins();
  const act=ACT.daySummary(today());
  // Rule order: streak risk (evening) → no check-in 2h+ → no focus by late morning → low energy → priority push → daily quote
  if(h>=20){const missed=S.habits.filter(x=>!x.log[today()]).length;
    if(missed>0&&S.habits.length)return{lbl:'Streak Protection',txt:`${missed} habit${missed>1?'s':''} not logged today. 30 seconds now keeps your streaks alive.`,act:'Log habits →',go:'habits'};}
  if(h>=6&&h<22&&(gap===null||gap>120))return{lbl:'Check-in',txt:gap===null?'No log yet today. What are you doing right now, and how is your energy?':`${Math.floor(gap/60)}h since your last check-in. A 10-second log keeps your pattern data honest.`,act:'Quick log →',go:'hourly'};
  if(h>=11&&h<18&&(!act||act.focusMin===0)&&pri)return{lbl:'Deep Work Nudge',txt:`No focus session yet today. Your priority: “${pri.txt}”. One Pomodoro moves it forward.`,act:'Start focus →',go:'focus'};
  if(act&&act.avgE!==null&&act.avgE<4.5)return{lbl:'Energy Care',txt:`Average energy today is ${act.avgE.toFixed(1)}/10. A short walk, water, or 5 minutes of pranayama before pushing harder.`,act:'Burnout check →',go:'burnout'};
  if(pri)return{lbl:'Priority',txt:`“${pri.txt}” — this is your #1 right now. ${QUOTES[new Date().getDate()%QUOTES.length]}`,act:pri.kind==='goal'?'Open goals →':'Open tasks →',go:pri.kind==='goal'?'goals':'tasks'};
  return{lbl:'Today',txt:QUOTES[new Date().getDate()%QUOTES.length],act:'Set a goal →',go:'goals'};
}
function nudgeAction(go){if(go==='focus')openFocus();else goPanelB(go);}
let lastNotifAt=DB.get('lastNotifAt',0);
function nudgeTick(){
  if(!NCFG.enabled)return;
  const n=buildNudge();
  // refresh dashboard card if visible
  const card=document.getElementById('nudge-card');
  if(card)card.innerHTML=`<div class="nc-lbl">◈ ${n.lbl}</div><div class="nc-txt">${escH(n.txt)}</div><div class="nc-act" onclick="nudgeAction('${n.go}')">${n.act}</div>`;
  // system notification at most every 2h, only for action nudges
  if(NCFG.notifs&&'Notification'in window&&Notification.permission==='granted'&&['Check-in','Streak Protection','Deep Work Nudge'].includes(n.lbl)&&Date.now()-lastNotifAt>2*3600*1000&&document.hidden){
    try{new Notification('Life OS · '+n.lbl,{body:n.txt});lastNotifAt=Date.now();DB.set('lastNotifAt',lastNotifAt);}catch(e){}
  }
}
function toggleNotifs(){
  if(!('Notification'in window)){toast('⚠️','Notifications not supported in this browser');return;}
  if(NCFG.notifs){NCFG.notifs=false;DB.set('nudgeCfg',NCFG);toast('🔕','Reminders off');renderSettings();return;}

}

// ── LIFE SCORE ENGINE ──────────────────────────
function computeLifeScore(){
  // Habits: completion over the last 7 days
  const week=[...Array(7)].map((_,i)=>dkey(addDays(new Date(),-i)));
  const habitsDone=S.habits.reduce((a,h)=>a+week.filter(d=>h.log[d]).length,0);
  const habitsTotal=S.habits.length*7;
  const hPct=habitsTotal>0?habitsDone/habitsTotal*100:50;
  const tasksDone=S.tasks.filter(t=>t.done).length,tasksTotal=S.tasks.length;
  const tPct=tasksTotal>0?tasksDone/tasksTotal*100:50;
  const eventsToday=S.events.filter(e=>e.ts&&e.ts.startsWith(today())).length;
  const ePct=Math.min(eventsToday/6*100,100);
  const bPct=(100-Math.round((100-S.burnout.energy*.6+S.burnout.stress*.4)));
  const score=Math.round(hPct*.35+tPct*.25+ePct*.2+bPct*.2);
  document.getElementById('lifescore').textContent=score;
  document.getElementById('lifebar').style.width=score+'%';
  document.getElementById('lifesub').textContent=`${Math.round(hPct)}% habits · ${S.focusSessions} focus sessions`;
  document.getElementById('ds-recovery')&&(document.getElementById('ds-recovery').textContent=score+'%');
  return score;
}

function renderHLInsights(){
  const el=document.getElementById('hl-insights');if(!el)return;
  // Aggregate energy by hour across ALL logged days
  const byHour={};
  Object.entries(S.hourlyLog).forEach(([k,v])=>{const h=k.split('|')[1]||k;(byHour[h]=byHour[h]||[]).push(v.energy);});
  const avgs=Object.entries(byHour).map(([h,arr])=>({h,avg:arr.reduce((a,b)=>a+b,0)/arr.length,n:arr.length})).sort((a,b)=>b.avg-a.avg);
  if(avgs.length<2){el.innerHTML='Log a few hours across your day — your personal peak-focus window and energy dips will appear here, computed from your real data.';return;}
  const peak=avgs[0],dip=avgs[avgs.length-1];
  const totalLogs=Object.keys(S.hourlyLog).length;
  el.innerHTML=`
    📈 <strong style="color:var(--t0)">Peak Energy Hour:</strong> ${peak.h}:00 — avg ${peak.avg.toFixed(1)}/10 across ${peak.n} log${peak.n>1?'s':''}. Protect this for deep work / trading.<br>
    ⬇️ <strong style="color:var(--t0)">Lowest Energy Hour:</strong> ${dip.h}:00 — avg ${dip.avg.toFixed(1)}/10. Schedule rest or admin, not decisions.<br>
    🗂 <strong style="color:var(--t0)">Data:</strong> ${totalLogs} hourly logs collected. More logs → sharper pattern.`;

    return `<div class="hl-cell${log?' logged':''}" onclick="openHLForm('${h}')">

      <div class="hl-energy">${emoji}</div>

function updateBurnout(){
  const pos=['energy','clarity','sleep','motivation'];

  const risk=Math.round((100-avgPos)*.6+S.burnout.stress*.4);
  const fill=document.getElementById('gfill');
  const offset=180-(risk/100*180);
  if(fill)fill.setAttribute('stroke-dashoffset',offset);
  const num=document.getElementById('bnum'),lbl=document.getElementById('blbl'),adv=document.getElementById('badv');
  if(num)num.textContent=risk+'%';
  const c=risk<30?'var(--em)':risk<55?'var(--saf)':'var(--ros)';
  if(num)num.style.color=c;
  if(lbl)lbl.textContent=risk<30?'Low Risk · Excellent':risk<55?'Moderate · Monitor':'High Risk · Act Now';

    </div>
  </div>`;
  document.body.appendChild(ov);
}
function init(){
  ACT.init();
  buildNav();buildPanels();
  renderPanel('dashboard');
  initClock();computeLifeScore();updateTaskStats();updateStreakStat();
  document.getElementById('ss-ev').textContent=S.events.length;
  document.getElementById('ss-fs').textContent=S.focusSessions;
  updateFocusRing();
  syncLayout();
  window.addEventListener('resize',onViewportChange);
  window.addEventListener('orientationchange',()=>setTimeout(onViewportChange,120));
  if(window.visualViewport)window.visualViewport.addEventListener('resize',onViewportChange);
  nudgeTick();setInterval(nudgeTick,5*60*1000);
  setInterval(maybePrompt,60*1000);
  setInterval(maybeHourPrompt,60*1000);
  setTimeout(maybeHourPrompt,30*1000);
  setTimeout(maybePrompt,90*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){setTimeout(maybeHourPrompt,1200);setTimeout(maybePrompt,2500);}});
  if(FRESH===null&&!localStorage.getItem('los_tasks'))showWelcome();
  if(location.protocol!=='file:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  setTimeout(()=>toast('🚀','Life OS ready, '+PROFILE.name+'!'),700);
}
init();
</script>
